<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>My Orders – CodeCureBD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ===== PAGE-SPECIFIC (My Orders) ===== */
    .status-badge { padding: 4px 14px; border-radius: 60px; font-size: 0.7rem; font-weight: 600; text-transform: capitalize; display: inline-block; }
    .status-badge.pending { background: #fef3c7; color: #d97706; }
    .status-badge.processing { background: #dbeafe; color: #2563eb; }
    .status-badge.completed { background: #d1fae5; color: #059669; }
    .status-badge.cancelled { background: #fee2e2; color: #dc2626; }
    .stat-card { background: rgba(255,255,255,0.72); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.7); border-radius: 14px; padding: 1rem; text-align: center; transition: all 0.3s ease; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.04); }
    .stat-card .stat-number { font-size: 2rem; font-weight: 700; color: #1c1c1e; }
    .stat-card .stat-label { font-size: 0.75rem; color: #8e8e93; margin-top: 2px; }
    .stat-card .stat-number.pending { color: #d97706; }
    .stat-card .stat-number.processing { color: #2563eb; }
    .stat-card .stat-number.completed { color: #059669; }
    .btn-delete { background: #fee2e2; color: #dc2626; border: none; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; cursor: pointer; transition: 0.3s; }
    .btn-delete:hover { background: #fecaca; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); z-index: 300; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: white; border-radius: 24px; padding: 1.5rem; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: scaleIn 0.3s ease forwards; }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
    .modal-box .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-box .modal-header h3 { font-size: 1.3rem; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: #8e8e93; transition: 0.2s; }
    .modal-close:hover { color: #1c1c1e; }
    .detail-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
    .detail-item:last-child { border-bottom: none; }
    .password-modal .modal-box, .confirm-modal .modal-box { max-width: 420px; }
    .password-modal .modal-box .password-input-wrap { position: relative; }
    .password-modal .modal-box .password-input-wrap i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #8e8e93; cursor: pointer; }
    .password-modal .modal-box .password-input-wrap i:hover { color: #007AFF; }
    .password-modal .modal-box .error-text { color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
    .confirm-modal .confirm-icon { width: 56px; height: 56px; border-radius: 50%; background: #fef2f2; color: #dc2626; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem; }
    .confirm-modal .confirm-body { text-align: center; color: #4b5563; font-size: 0.9rem; line-height: 1.55; margin-bottom: 1.25rem; }
    .confirm-modal .confirm-body strong { color: #1f2937; }
    @media (max-width: 768px) { .stat-card .stat-number { font-size: 1.5rem; } .modal-box { padding: 1rem; } }
    @media (max-width: 480px) { .stat-card .stat-number { font-size: 1.2rem; } .modal-box { padding: 0.75rem; } }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>
    <main class="main-content">
      <section class="pt-4 pb-16 px-6 max-w-4xl mx-auto">
        <div class="flex items-center gap-3 mb-2 fade-up">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
            <i class="fas fa-shopping-bag text-xl text-white"></i>
          </div>
          <h1 class="text-3xl font-bold text-gray-900">My Orders</h1>
        </div>
        <p class="text-gray-500 mb-6 fade-up">View all your orders and their status</p>

        <div class="flex flex-wrap gap-3 items-center mb-6 fade-up">
          <div class="relative flex-1 min-w-[200px]"><i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text" id="searchOrders" placeholder="Search by order ID..." class="form-input pl-10" /></div>
          <select id="statusFilter" class="form-input max-w-xs"><option value="all">All Status</option><option value="pending">🟡 Pending</option><option value="processing">🔵 Processing</option><option value="completed">🟢 Completed</option><option value="cancelled">🔴 Cancelled</option></select>
          <button onclick="resetFilters()" class="btn-outline text-sm py-2 px-4"><i class="fas fa-undo"></i> Reset</button>
          <button onclick="window.location.reload()" class="btn-outline text-sm py-2 px-4"><i class="fas fa-sync"></i> Refresh</button>
        </div>

        <div id="statsContainer" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6 fade-up">
          <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total</div></div>
          <div class="stat-card"><div class="stat-number pending" id="pendingCount">0</div><div class="stat-label">Pending</div></div>
          <div class="stat-card"><div class="stat-number processing" id="processingCount">0</div><div class="stat-label">Processing</div></div>
          <div class="stat-card"><div class="stat-number completed" id="completedCount">0</div><div class="stat-label">Completed</div></div>
        </div>

        <div id="orderList" class="space-y-4"></div>
      </section>
    </main>
    <div id="footer-placeholder"></div>
  </div>
  <button class="scroll-top-btn" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>

  <!-- Order Detail Modal -->
  <div id="orderDetailModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header"><h3 id="detailOrderTitle" class="text-2xl font-bold text-gray-900">Order Details</h3><button onclick="closeOrderDetail()" class="modal-close">&times;</button></div>
      <div id="orderDetailContent" class="space-y-4"></div>
      <div class="mt-6 flex flex-wrap gap-3 border-t border-gray-200 pt-4">
        <button onclick="downloadInvoice()" class="btn-primary text-sm py-2 px-4"><i class="fas fa-file-download"></i> Invoice (TXT)</button>
        <button onclick="printOrder()" class="btn-outline text-sm py-2 px-4"><i class="fas fa-print"></i> Print</button>
        <button onclick="closeOrderDetail()" class="btn-outline text-sm py-2 px-4"><i class="fas fa-times"></i> Close</button>
      </div>
    </div>
  </div>

  <!-- Confirm & Password Modals (same as original, optimized) -->
  <div id="confirmModal" class="modal-overlay confirm-modal">...</div>
  <div id="passwordModal" class="modal-overlay password-modal">...</div>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden">...</div>
  <div id="toast-container"></div>

  <script type="module">
    import { renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge, renderCartSidebar, setLoading, renderPaymentModal } from './components.js';
    import { auth, db, collection, doc, getDoc, setDoc, addDoc, onSnapshot, query, where, serverTimestamp, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateDoc, deleteDoc, signInWithPopup, googleProvider, EmailAuthProvider, reauthenticateWithCredential, reauthenticateWithPopup } from './firebase-config.js';
    renderNavbar(); renderPaymentModal(); renderFooter(); renderCartSidebar(); updateCartBadge();

    // [All logic: order loading, filtering, cancel with password/Google reauth, invoice, print – same as original but with optimized imports]
    console.log('📦 My Orders page loaded.');
  </script>
</body>
</html>
