<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Product Detail – CodeCureBD</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* ===== BASE ===== */
    * { box-sizing: border-box; }
    body {
      background: #f2f4f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      box-shadow: 0 12px 40px rgba(0,0,0,0.06);
      transform: translateY(-3px);
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid rgba(60, 60, 67, 0.08);
      border-radius: 12px;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.8);
      transition: all 0.3s ease;
      outline: none;
      font-family: 'Inter', sans-serif;
      color: #1c1c1e;
    }
    .form-input:focus {
      border-color: #007AFF;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.08);
      background: #ffffff;
    }
    .form-input::placeholder {
      color: #8e8e93;
      opacity: 0.7;
    }
    textarea.form-input {
      resize: vertical;
      min-height: 80px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 122, 255, 0.35);
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .btn-outline {
      background: transparent;
      color: #1c1c1e;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1.5px solid rgba(60,60,67,0.08);
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.5);
      min-height: 48px;
    }
    .btn-outline:hover {
      background: rgba(0,122,255,0.04);
      border-color: #007AFF;
      color: #007AFF;
      transform: translateY(-2px);
    }
    /* Try Now button */
    .btn-try-now {
      background: linear-gradient(135deg, #FF6B6B, #EE5A24);
      color: #fff;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      box-shadow: 0 4px 16px rgba(238, 90, 36, 0.25);
    }
    .btn-try-now:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(238, 90, 36, 0.35);
    }
    .rating-stars .star {
      font-size: 2rem;
      cursor: pointer;
      transition: 0.2s;
      color: #d1d5db;
    }
    .rating-stars .star.active {
      color: #f59e0b;
    }
    .rating-stars .star:hover {
      transform: scale(1.2);
    }

    /* ===== IMAGE CONTAINER WITH ARROWS ===== */
    .image-container {
      position: relative;
      background: #f0f2f5;
      border-radius: 12px;
      overflow: hidden;
    }
    .image-container .main-image {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      display: block;
      transition: opacity 0.25s ease;
      background: #f0f2f5;
    }
    .image-container .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      z-index: 5;
      opacity: 0.7;
    }
    .image-container .nav-arrow:hover {
      background: rgba(0,0,0,0.7);
      opacity: 1;
      transform: translateY(-50%) scale(1.05);
    }
    .image-container .nav-arrow.left {
      left: 12px;
    }
    .image-container .nav-arrow.right {
      right: 12px;
    }
    .image-container .fullscreen-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
    }
    .image-container .fullscreen-btn:hover {
      background: rgba(0,0,0,0.8);
      opacity: 1;
      transform: scale(1.05);
    }
    .image-counter {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 2px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      z-index: 5;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ===== FULLSCREEN OVERLAY (image) ===== */
    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(12px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 1rem;
    }
    .fullscreen-overlay.open {
      display: flex;
    }
    .fullscreen-overlay .close-fs {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      z-index: 10;
    }
    .fullscreen-overlay .close-fs:hover {
      background: rgba(255,255,255,0.25);
      transform: scale(1.05);
    }
    .fullscreen-overlay .fs-image-container {
      position: relative;
      width: 100%;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fullscreen-overlay .fs-image-container img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .fullscreen-overlay .fs-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(4px);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      z-index: 6;
    }
    .fullscreen-overlay .fs-arrow:hover {
      background: rgba(255,255,255,0.25);
      transform: translateY(-50%) scale(1.05);
    }
    .fullscreen-overlay .fs-arrow.left {
      left: 20px;
    }
    .fullscreen-overlay .fs-arrow.right {
      right: 20px;
    }
    .fullscreen-overlay .fs-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
      background: rgba(0,0,0,0.3);
      padding: 4px 16px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      z-index: 6;
      pointer-events: none;
    }
    @media (max-width: 768px) {
      .fullscreen-overlay .fs-arrow {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }
      .fullscreen-overlay .fs-arrow.left { left: 8px; }
      .fullscreen-overlay .fs-arrow.right { right: 8px; }
      .fullscreen-overlay .close-fs {
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
        top: 12px;
        right: 12px;
      }
      .image-container .main-image {
        max-height: 300px;
      }
      .image-container .nav-arrow {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }
    }
    @media (max-width: 480px) {
      .image-container .main-image {
        max-height: 250px;
      }
    }

    /* ===== SKELETON ===== */
    .skeleton-img {
      width: 100%;
      height: 300px;
      background: #e5e7eb;
      border-radius: 12px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-line {
      height: 16px;
      background: #e5e7eb;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-line.short { width: 40%; }
    .skeleton-line.medium { width: 70%; }
    @keyframes pulse {
      0%,100% { opacity:1; }
      50% { opacity:0.5; }
    }
    .fade-up {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .scroll-top-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0,122,255,0.35);
      z-index: 999;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    .scroll-top-btn.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .scroll-top-btn:hover { transform: scale(1.05); }

    /* ===== REVIEW ITEM ===== */
    .review-item {
      border-bottom: 1px solid #f3f4f6;
      padding: 12px 0;
    }
    .review-item:last-child {
      border-bottom: none;
    }
    .detail-image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 12px;
      background: #f0f2f5;
    }
    .discount-badge {
      background: #dc2626;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 4px 16px;
      border-radius: 60px;
      box-shadow: 0 4px 16px rgba(220, 38, 38, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .price-wrapper {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-top: 0.5rem;
    }
    .original-price {
      text-decoration: line-through;
      color: #9ca3af;
      font-size: 1.1rem;
    }
    .discount-price {
      color: #16a34a;
      font-weight: 700;
      font-size: 2rem;
    }
    .discount-percent-tag {
      background: rgba(220, 38, 38, 0.10);
      color: #dc2626;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 2px 14px;
      border-radius: 40px;
      border: 1px solid rgba(220, 38, 38, 0.12);
    }

    /* ===== TRY NOW OVERLAY (full screen inside page) ===== */
    .trynow-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-y: auto;
    }
    .trynow-overlay.open {
      display: flex;
    }
    .trynow-overlay .overlay-inner {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      max-width: 1100px;
      width: 100%;
      max-height: 92vh;
      height: 92vh;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.5);
      position: relative;
      animation: scaleIn 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    @keyframes scaleIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .trynow-overlay .close-overlay {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .trynow-overlay .close-overlay:hover {
      background: rgba(0,0,0,0.5);
      transform: scale(1.05);
    }
    .trynow-overlay .demo-content {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      background: #fff;
    }
    .trynow-overlay .demo-content iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Bottom bar */
    .trynow-overlay .bottom-bar {
      flex-shrink: 0;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.3);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
      z-index: 5;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.04);
    }
    .trynow-overlay .bottom-bar::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      height: 50px;
      background: linear-gradient(to top, rgba(255,255,255,0.7) 0%, transparent 100%);
      pointer-events: none;
    }
    .trynow-overlay .bottom-bar button {
      padding: 8px 20px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      font-family: 'Inter', sans-serif;
    }
    .trynow-overlay .bottom-bar .btn-buy {
      background: linear-gradient(135deg, #34C759, #28A745);
      color: #fff;
      box-shadow: 0 4px 16px rgba(52, 199, 89, 0.25);
    }
    .trynow-overlay .bottom-bar .btn-buy:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(52, 199, 89, 0.35);
    }
    .trynow-overlay .bottom-bar .btn-cart {
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.2);
    }
    .trynow-overlay .bottom-bar .btn-cart:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0, 122, 255, 0.3);
    }
    .trynow-overlay .bottom-bar .btn-close {
      background: rgba(0,0,0,0.04);
      color: #1c1c1e;
      border: 1px solid rgba(0,0,0,0.06);
      backdrop-filter: blur(4px);
    }
    .trynow-overlay .bottom-bar .btn-close:hover {
      background: rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    @media (max-width: 640px) {
      .trynow-overlay { padding: 0.5rem; }
      .trynow-overlay .overlay-inner { border-radius: 20px; max-height: 96vh; height: 96vh; }
      .trynow-overlay .bottom-bar { padding: 8px 10px; gap: 4px; }
      .trynow-overlay .bottom-bar button { padding: 6px 14px; font-size: 0.75rem; min-height: 32px; gap: 4px; }
      .trynow-overlay .close-overlay { top: 10px; right: 12px; width: 34px; height: 34px; font-size: 1.2rem; }
    }
    @media (max-width: 480px) {
      .trynow-overlay .bottom-bar button { padding: 4px 10px; font-size: 0.65rem; min-height: 28px; gap: 3px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>
    <main class="main-content">
      <section class="pt-28 pb-16 px-6 max-w-4xl mx-auto">
        <div id="productDetailContainer">
          <!-- Skeleton -->
          <div class="fade-up">
            <div class="skeleton-img"></div>
            <div class="skeleton-line medium" style="margin-top:1rem;"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-line" style="width:50%;"></div>
            <div style="display:flex; gap:1rem; margin-top:1rem;">
              <div class="skeleton-line" style="width:30%;"></div>
              <div class="skeleton-line" style="width:40%;"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="footer-placeholder"></div>
  </div>

  <!-- ===== BACK TO TOP ===== -->
  <button class="scroll-top-btn" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>

  <!-- ===== FULLSCREEN OVERLAY (image) ===== -->
  <div class="fullscreen-overlay" id="fullscreenOverlay">
    <button class="close-fs" id="closeFullscreen" aria-label="Close fullscreen"><i class="fas fa-times"></i></button>
    <div class="fs-image-container">
      <button class="fs-arrow left" id="fsPrev"><i class="fas fa-chevron-left"></i></button>
      <img id="fsImage" src="" alt="Fullscreen view" />
      <button class="fs-arrow right" id="fsNext"><i class="fas fa-chevron-right"></i></button>
      <div class="fs-counter" id="fsCounter"></div>
    </div>
  </div>

  <!-- ===== AUTH MODAL ===== -->
  <div id="authModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 id="authModalTitle" class="text-2xl font-bold">Sign In</h3>
        <button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
      </div>
      <form id="authForm" class="space-y-4">
        <input type="email" id="authEmail" placeholder="Email" required class="form-input" />
        <div class="relative">
          <input type="password" id="authPassword" placeholder="Password" required class="form-input pr-10" />
          <button type="button" onclick="togglePasswordVisibility('authPassword')" class="absolute right-3 top-3 text-gray-400"><i class="fas fa-eye"></i></button>
        </div>
        <button type="submit" class="btn-primary w-full justify-center">Continue</button>
      </form>
      <div class="mt-4 flex flex-col gap-2">
        <button onclick="window.socialLogin('google')" class="btn-outline w-full justify-center"><i class="fab fa-google"></i> Sign in with Google</button>
      </div>
      <p class="mt-4 text-sm text-gray-500 text-center">
        <span id="authToggleText">Don't have an account?</span>
        <a href="#" id="authToggleLink" class="text-blue-600 font-medium">Sign Up</a>
      </p>
      <div id="authError" class="text-red-500 text-sm mt-2 hidden"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- ===== TRY NOW OVERLAY (full page inside) ===== -->
  <div class="trynow-overlay" id="trynowOverlay">
    <div class="overlay-inner">
      <button class="close-overlay" onclick="closeTryNow()" aria-label="Close">&times;</button>
      <!-- Demo content area -->
      <div class="demo-content" id="demoContent">
        <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#94a3b8; font-size:1.2rem;">
          <i class="fas fa-spinner fa-spin mr-2"></i> Loading demo...
        </div>
      </div>
      <!-- Bottom bar -->
      <div class="bottom-bar">
        <button class="btn-buy" onclick="window.buyNow()"><i class="fas fa-bolt"></i> Buy Now</button>
        <button class="btn-cart" onclick="window.addToCart()"><i class="fas fa-cart-plus"></i> Add to Cart</button>
        <button class="btn-close" onclick="closeTryNow()"><i class="fas fa-times"></i> Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    // ================================================================
    // IMPORTS
    // ================================================================
    import {
      renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge,
      renderCartSidebar, setLoading, renderPaymentModal, uploadImage
    } from './components.js';
    import {
      auth, db, collection, doc, getDoc, getDocs, addDoc, updateDoc,
      query, where, serverTimestamp, onAuthStateChanged, signOut,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signInWithPopup, googleProvider, setDoc, onSnapshot
    } from './firebase-config.js';

    // ================================================================
    // RENDER COMMON
    // ================================================================
    renderNavbar();
    renderFooter();
    renderCartSidebar();
    renderPaymentModal();
    updateCartBadge();

    window.showToast = (message, type = 'success') => {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 400); }, 4500);
    };

    // ===== SCROLL OBSERVER =====
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    });

    // ===== BACK TO TOP =====
    const scrollBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      scrollBtn.classList.toggle('show', window.scrollY > 400);
    });
    scrollBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ================================================================
    // AUTH MODAL (unchanged)
    // ================================================================
    let currentAuthMode = 'signin';
    window.openAuthModal = (mode) => {
      currentAuthMode = mode;
      document.getElementById('authModalTitle').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
      document.getElementById('authToggleText').textContent = mode === 'signin' ? "Don't have an account?" : "Already have an account?";
      document.getElementById('authToggleLink').textContent = mode === 'signin' ? 'Sign Up' : 'Sign In';
      document.getElementById('authError').classList.add('hidden');
      document.getElementById('authModal').classList.remove('hidden');
    };
    window.closeAuthModal = () => document.getElementById('authModal').classList.add('hidden');

    document.getElementById('authToggleLink').addEventListener('click', (e) => {
      e.preventDefault();
      currentAuthMode = currentAuthMode === 'signin' ? 'signup' : 'signin';
      window.openAuthModal(currentAuthMode);
    });

    window.togglePasswordVisibility = (id) => {
      const input = document.getElementById(id);
      if (input) input.type = input.type === 'password' ? 'text' : 'password';
    };

    window.socialLogin = async (provider) => {
      if (provider !== 'google') {
        showToast('Only Google sign-in is supported', 'warning');
        return;
      }
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (!userDoc.exists()) {
          await setDoc(doc(db, 'users', user.uid), {
            email: user.email || '',
            displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'User'),
            photoURL: user.photoURL || '',
            role: 'user',
            createdAt: new Date().toISOString(),
            isActive: true,
            emailVerified: !!user.emailVerified,
          });
        }
        showToast('✅ Signed in with Google', 'success');
        if (typeof closeAuthModal === 'function') closeAuthModal();
        else if (typeof window.closeAuthModal === 'function') window.closeAuthModal();
      } catch (error) {
        console.error('Google sign-in error:', error);
        let msg = error.message || 'Sign-in failed';
        if (error.code === 'auth/popup-closed-by-user') msg = 'Sign-in cancelled';
        else if (error.code === 'auth/popup-blocked') msg = 'Popup blocked. Allow popups for this site.';
        else if (error.code === 'auth/unauthorized-domain') msg = 'Domain not authorized in Firebase Console.';
        else if (error.code === 'auth/operation-not-allowed') msg = 'Google sign-in is not enabled in Firebase Console.';
        showToast('⚠️ ' + msg, 'error');
        const errEl = document.getElementById('authError');
        if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
      }
    };

    const authForm = document.getElementById('authForm');
    const authSubmitBtn = authForm.querySelector('button[type="submit"]');
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const errorDiv = document.getElementById('authError');
      errorDiv.classList.add('hidden');
      setLoading(authSubmitBtn, true, 'Continue');
      try {
        let userCred;
        if (currentAuthMode === 'signin') {
          userCred = await signInWithEmailAndPassword(auth, email, password);
          showToast('✅ Signed in!', 'success');
        } else {
          userCred = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, 'users', userCred.user.uid), {
            email, displayName: email.split('@')[0], role: 'user', createdAt: new Date().toISOString()
          });
          showToast('✅ Account created!', 'success');
        }
        closeAuthModal();
        authForm.reset();
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        showToast('⚠️ ' + error.message, 'error');
      } finally {
        setLoading(authSubmitBtn, false);
      }
    });

    window.handleLogout = async () => {
      await signOut(auth);
      showToast('✅ Logged out', 'success');
      window.location.href = 'index.html';
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        const displayName = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
        updateNavbarAuth(user, displayName);
      } else {
        updateNavbarAuth(null, null);
      }
    });

    // ================================================================
    // PRODUCT DETAIL LOGIC
    // ================================================================
    const container = document.getElementById('productDetailContainer');
    let currentProductId = null;
    let currentProductData = null;
    let allDiscounts = [];
    let productDemos = {};

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    // Listen to demos
    onSnapshot(collection(db, 'productDemos'), (snapshot) => {
      productDemos = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.productId) {
          productDemos[data.productId] = { id: doc.id, ...data };
        }
      });
      console.log('✅ Demos loaded:', productDemos);
      if (currentProductData) {
        renderProductDetail(currentProductData);
      }
    }, (error) => {
      console.warn('Error loading demos:', error);
    });

    if (!productId) {
      container.innerHTML = `
        <div class="glass-card text-center py-12 fade-up">
          <i class="fas fa-exclamation-circle text-4xl text-red-400 mb-4"></i>
          <h2 class="text-2xl font-bold text-gray-900">No product specified</h2>
          <p class="text-gray-500 mt-2">Please go back to the store and select a product.</p>
          <a href="get-new-website.html" class="btn-primary mt-4 inline-block">← Back to Store</a>
        </div>
      `;
    } else {
      currentProductId = productId;
      getDocs(collection(db, 'discounts')).then(snap => {
        allDiscounts = [];
        snap.forEach(doc => allDiscounts.push({ id: doc.id, ...doc.data() }));
        loadProduct(productId);
      }).catch(err => {
        console.error('Error loading discounts:', err);
        allDiscounts = [];
        loadProduct(productId);
      });
    }

    function getDiscountForProduct(product) {
      if (!allDiscounts || allDiscounts.length === 0) return null;
      const specific = allDiscounts.filter(d => d.type === 'specific' && d.productId === product.id);
      if (specific.length > 0) {
        return specific.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, specific[0]);
      }
      if (product.category) {
        const catDiscounts = allDiscounts.filter(d => d.type === 'category' && d.category === product.category);
        if (catDiscounts.length > 0) {
          return catDiscounts.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, catDiscounts[0]);
        }
      }
      const all = allDiscounts.filter(d => d.type === 'all');
      if (all.length > 0) {
        return all.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, all[0]);
      }
      return null;
    }

    function renderStars(rating) {
      const full = Math.floor(rating);
      const half = rating % 1 >= 0.5 ? 1 : 0;
      let s = '';
      for (let i = 0; i < full; i++) s += '★';
      if (half) s += '☆';
      for (let i = 0; i < 5 - full - half; i++) s += '☆';
      return s;
    }

    let productImages = [];
    let currentImageIndex = 0;

    function updateMainImage(index) {
      const img = document.getElementById('mainProductImage');
      const counter = document.getElementById('imageCounter');
      if (!img || !counter) return;
      if (productImages.length === 0) {
        img.src = 'https://via.placeholder.com/600x400?text=No+Image';
        counter.textContent = '0 / 0';
        return;
      }
      if (index < 0) index = productImages.length - 1;
      if (index >= productImages.length) index = 0;
      currentImageIndex = index;
      img.src = productImages[currentImageIndex];
      counter.textContent = `${currentImageIndex + 1} / ${productImages.length}`;
    }

    function nextImage() {
      if (productImages.length === 0) return;
      updateMainImage(currentImageIndex + 1);
    }

    function prevImage() {
      if (productImages.length === 0) return;
      updateMainImage(currentImageIndex - 1);
    }

    function openFullscreen() {
      const overlay = document.getElementById('fullscreenOverlay');
      const fsImg = document.getElementById('fsImage');
      const counter = document.getElementById('fsCounter');
      if (productImages.length === 0) {
        showToast('No images to view', 'warning');
        return;
      }
      fsImg.src = productImages[currentImageIndex];
      counter.textContent = `${currentImageIndex + 1} / ${productImages.length}`;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeFullscreen() {
      document.getElementById('fullscreenOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function fsNext() {
      if (productImages.length === 0) return;
      let newIdx = currentImageIndex + 1;
      if (newIdx >= productImages.length) newIdx = 0;
      currentImageIndex = newIdx;
      document.getElementById('fsImage').src = productImages[currentImageIndex];
      document.getElementById('fsCounter').textContent = `${currentImageIndex + 1} / ${productImages.length}`;
      updateMainImage(currentImageIndex);
    }

    function fsPrev() {
      if (productImages.length === 0) return;
      let newIdx = currentImageIndex - 1;
      if (newIdx < 0) newIdx = productImages.length - 1;
      currentImageIndex = newIdx;
      document.getElementById('fsImage').src = productImages[currentImageIndex];
      document.getElementById('fsCounter').textContent = `${currentImageIndex + 1} / ${productImages.length}`;
      updateMainImage(currentImageIndex);
    }

    async function loadProduct(id) {
      try {
        const docSnap = await getDoc(doc(db, 'products', id));
        if (!docSnap.exists()) {
          container.innerHTML = `
            <div class="glass-card text-center py-12 fade-up">
              <i class="fas fa-box-open text-4xl text-gray-400 mb-4"></i>
              <h2 class="text-2xl font-bold text-gray-900">Product not found</h2>
              <p class="text-gray-500 mt-2">The product you are looking for does not exist.</p>
              <a href="get-new-website.html" class="btn-primary mt-4 inline-block">← Back to Store</a>
            </div>
          `;
          return;
        }
        currentProductData = { id, ...docSnap.data() };
        productImages = currentProductData.images || [];
        if (productImages.length === 0 && currentProductData.imageUrl) {
          productImages = [currentProductData.imageUrl];
        }
        if (productImages.length === 0) {
          productImages = ['https://via.placeholder.com/600x400?text=No+Image'];
        }
        currentImageIndex = 0;
        renderProductDetail(currentProductData);
        loadReviews(id);
        document.title = `${currentProductData.name} – CodeCureBD`;
      } catch (err) {
        console.error('Error loading product:', err);
        container.innerHTML = `
          <div class="glass-card text-center py-12 fade-up">
            <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-900">Error loading product</h2>
            <p class="text-gray-500 mt-2">${err.message}</p>
            <button onclick="window.location.reload()" class="btn-primary mt-4 inline-block">Retry</button>
          </div>
        `;
      }
    }

    // ===== TRY NOW OVERLAY FUNCTIONS =====
    function openTryNow() {
      const overlay = document.getElementById('trynowOverlay');
      const content = document.getElementById('demoContent');
      
      // Check if demo exists for this product
      const demo = productDemos[currentProductId];
      console.log('🔍 Trying to open demo for product:', currentProductId, 'Demo found:', !!demo);
      
      if (!demo || !demo.htmlContent) {
        showToast('No demo available for this product.', 'warning');
        console.warn('No demo content for product:', currentProductId);
        return;
      }

      // Escape the HTML content for srcdoc
      const escapedHtml = demo.htmlContent.replace(/"/g, '&quot;');
      
      // Inject demo HTML into content area using iframe to isolate styles
      content.innerHTML = `<iframe id="demoIframe" style="width:100%; height:100%; border:none;" srcdoc="${escapedHtml}"></iframe>`;
      
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      console.log('✅ Try Now overlay opened.');
    }

    function closeTryNow() {
      document.getElementById('trynowOverlay').classList.remove('open');
      document.body.style.overflow = '';
      // Clean up iframe
      const content = document.getElementById('demoContent');
      content.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#94a3b8; font-size:1.2rem;"><i class="fas fa-spinner fa-spin mr-2"></i> Loading demo...</div>`;
      console.log('❌ Try Now overlay closed.');
    }

    // ==== EXPOSE FUNCTIONS TO GLOBAL SCOPE ====
    window.openTryNow = openTryNow;
    window.closeTryNow = closeTryNow;
    window.addToCart = addToCart;
    window.buyNow = buyNow;
    window.submitRating = submitRating;

    // ================================================================
    // RENDER PRODUCT DETAIL (with Try Now button)
    // ================================================================
    function renderProductDetail(product) {
      const discount = getDiscountForProduct(product);
      const desc = product.desc || product.description || '';
      const rating = product.averageRating || 0;
      const ratingCount = product.ratingCount || 0;

      let priceHtml = '';
      let badgeHtml = '';
      if (discount) {
        const percent = Math.round(discount.discountPercent);
        const discounted = product.price * (1 - discount.discountPercent / 100);
        priceHtml = `
          <span class="original-price">$${product.price.toFixed(2)}</span>
          <span class="discount-price">$${discounted.toFixed(2)}</span>
          <span class="discount-percent-tag">-${percent}%</span>
        `;
        badgeHtml = `<span class="discount-badge"><i class="fas fa-tag"></i> -${percent}%</span>`;
      } else {
        priceHtml = `<span class="discount-price" style="font-size:2rem;">$${product.price.toFixed(2)}</span>`;
      }

      const demo = productDemos[product.id] || null;
      const hasDemo = !!demo && !!demo.htmlContent;

      const mainImageSrc = productImages[0] || 'https://via.placeholder.com/600x400?text=No+Image';
      const imageCounterText = `${productImages.length > 0 ? '1' : '0'} / ${productImages.length}`;

      container.innerHTML = `
        <div class="fade-up">
          <div class="glass-card" style="padding:0; overflow:hidden;">
            <div class="image-container">
              <img id="mainProductImage" src="${mainImageSrc}" alt="${product.name}" class="main-image" loading="lazy" />
              <button class="nav-arrow left" id="prevImageBtn" aria-label="Previous image"><i class="fas fa-chevron-left"></i></button>
              <button class="nav-arrow right" id="nextImageBtn" aria-label="Next image"><i class="fas fa-chevron-right"></i></button>
              <button class="fullscreen-btn" id="fullscreenBtn" aria-label="View fullscreen"><i class="fas fa-expand"></i></button>
              <div class="image-counter" id="imageCounter">${imageCounterText}</div>
            </div>
            <div style="padding:1.5rem;">
              <h1 class="text-3xl font-bold text-gray-900">${product.name}</h1>
              <div class="mt-1 text-yellow-500 text-lg">
                ${renderStars(rating)} <span class="text-gray-500 text-sm">(${ratingCount} reviews)</span>
              </div>
              <div class="price-wrapper">${priceHtml}</div>
              <div class="mt-4 text-gray-700 whitespace-pre-wrap">${desc.replace(/\n/g, '<br>')}</div>
              <div class="mt-6 flex flex-wrap gap-3">
                <button onclick="window.addToCart()" class="btn-primary"><i class="fas fa-cart-plus"></i> Add to Cart</button>
                <button onclick="window.buyNow()" class="btn-primary" style="background:linear-gradient(135deg,#34C759,#28A745);"><i class="fas fa-bolt"></i> Buy Now</button>
                ${hasDemo ? `<button onclick="window.openTryNow()" class="btn-try-now"><i class="fas fa-play-circle"></i> Try Now</button>` : ''}
                <a href="get-new-website.html" class="btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
              </div>
            </div>
          </div>

          <div class="glass-card mt-8">
            <h3 class="text-xl font-bold text-gray-900 mb-4">Rate & Review</h3>
            <div class="rating-stars flex gap-2" id="ratingStars">
              <span class="star" data-val="1">☆</span>
              <span class="star" data-val="2">☆</span>
              <span class="star" data-val="3">☆</span>
              <span class="star" data-val="4">☆</span>
              <span class="star" data-val="5">☆</span>
            </div>
            <textarea id="ratingReview" rows="3" class="form-input mt-3" placeholder="Write your review..."></textarea>
            <button onclick="window.submitRating()" class="btn-primary mt-3 text-sm py-2 px-4"><i class="fas fa-paper-plane"></i> Submit Review</button>
            <div id="reviewsList" class="mt-6 space-y-2"></div>
          </div>
        </div>
      `;

      document.getElementById('prevImageBtn').addEventListener('click', prevImage);
      document.getElementById('nextImageBtn').addEventListener('click', nextImage);
      document.getElementById('fullscreenBtn').addEventListener('click', openFullscreen);

      document.addEventListener('keydown', (e) => {
        if (document.getElementById('fullscreenOverlay').classList.contains('open')) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); prevImage(); }
        if (e.key === 'ArrowRight') { e.preventDefault(); nextImage(); }
      });

      document.getElementById('closeFullscreen').addEventListener('click', closeFullscreen);
      document.getElementById('fsPrev').addEventListener('click', fsPrev);
      document.getElementById('fsNext').addEventListener('click', fsNext);
      document.getElementById('fullscreenOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeFullscreen();
      });
      document.addEventListener('keydown', (e) => {
        if (!document.getElementById('fullscreenOverlay').classList.contains('open')) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); fsPrev(); }
        if (e.key === 'ArrowRight') { e.preventDefault(); fsNext(); }
        if (e.key === 'Escape') { closeFullscreen(); }
      });

      document.querySelectorAll('#ratingStars .star').forEach(el => {
        el.addEventListener('click', function() {
          const val = parseInt(this.dataset.val);
          document.querySelectorAll('#ratingStars .star').forEach(s => s.classList.remove('active'));
          for (let i = 0; i < val; i++) {
            document.querySelectorAll('#ratingStars .star')[i].classList.add('active');
          }
          window.selectedRating = val;
        });
      });

      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    }

    window.selectedRating = 0;

    async function addToCart() {
      if (!currentProductData) { showToast('Product not loaded', 'error'); return; }
      const product = currentProductData;
      const discount = getDiscountForProduct(product);
      let price = product.price;
      if (discount) price = product.price * (1 - discount.discountPercent / 100);
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existing = cart.find(item => item.id === product.id);
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          price: price,
          originalPrice: product.price,
          imageUrl: productImages[0] || product.imageUrl || '',
          quantity: 1
        });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      const user = auth.currentUser;
      if (user) {
        const { updateCartInFirestore } = await import('./components.js');
        updateCartInFirestore(user.uid, cart);
      }
      window.updateCartUI?.();
      showToast(`✅ "${product.name}" added to cart`, 'success');
    }

    async function buyNow() {
      await addToCart();
      setTimeout(() => {
        if (typeof window.checkout === 'function') window.checkout();
        else window.location.href = 'get-new-website.html?checkout=1';
      }, 500);
    }

    async function loadReviews(productId) {
      const reviewsContainer = document.getElementById('reviewsList');
      if (!reviewsContainer) return;
      try {
        const q = query(collection(db, 'ratings'), where('productId', '==', productId));
        const snap = await getDocs(q);
        if (snap.empty) {
          reviewsContainer.innerHTML = '<p class="text-gray-400 text-sm">No reviews yet. Be the first!</p>';
          return;
        }
        let html = '';
        snap.forEach(doc => {
          const r = doc.data();
          const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
          html += `
            <div class="review-item">
              <div class="flex justify-between">
                <span class="font-semibold text-gray-900">${r.userEmail || 'Anonymous'}</span>
                <span class="text-yellow-500">${stars}</span>
              </div>
              ${r.review ? `<p class="text-sm text-gray-600 mt-1">${r.review}</p>` : ''}
              <p class="text-xs text-gray-400 mt-1">${r.timestamp?.toDate?.()?.toLocaleString() || ''}</p>
            </div>
          `;
        });
        reviewsContainer.innerHTML = html;
      } catch (_) {
        reviewsContainer.innerHTML = '<p class="text-gray-400 text-sm">Error loading reviews.</p>';
      }
    }

    async function submitRating() {
      if (!currentProductData) { showToast('Product not loaded', 'error'); return; }
      if (!window.selectedRating || window.selectedRating < 1) {
        showToast('Please select a rating', 'warning');
        return;
      }
      const user = auth.currentUser;
      if (!user) { showToast('Please sign in to rate', 'warning'); return; }
      const review = document.getElementById('ratingReview').value.trim();
      try {
        await addDoc(collection(db, 'ratings'), {
          productId: currentProductData.id,
          userId: user.uid,
          userEmail: user.email,
          rating: window.selectedRating,
          review: review,
          timestamp: serverTimestamp()
        });
        const productRef = doc(db, 'products', currentProductData.id);
        const snap = await getDoc(productRef);
        const data = snap.data();
        const count = (data.ratingCount || 0) + 1;
        const avg = ((data.averageRating || 0) * (data.ratingCount || 0) + window.selectedRating) / count;
        await updateDoc(productRef, { averageRating: avg, ratingCount: count });
        showToast('✅ Review submitted!', 'success');
        window.selectedRating = 0;
        document.querySelectorAll('#ratingStars .star').forEach(s => s.classList.remove('active'));
        document.getElementById('ratingReview').value = '';
        loadReviews(currentProductData.id);
        renderProductDetail(currentProductData);
      } catch (err) {
        showToast('⚠️ ' + err.message, 'error');
      }
    }

    console.log('📄 Product detail page loaded with Try Now (global functions attached).');
  </script>
</body>
</html>
