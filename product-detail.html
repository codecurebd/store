<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Product Detail – CodeCureBD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ===== PAGE-SPECIFIC STYLES (Product Detail) ===== */
    * { box-sizing: border-box; }
    body {
      background: #f2f4f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* ── Static Preview (fixed sizing with zoom) ── */
    .static-preview {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      background: #f0f2f5;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .static-preview iframe {
      width: 117.65%;
      height: 117.65%;
      border: none;
      transform: scale(0.85);
      transform-origin: top left;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      background: #fff;
    }
    .static-preview .preview-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.02);
      pointer-events: none;
      border-radius: 12px;
    }
    .static-preview .preview-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.7rem;
      padding: 4px 14px;
      border-radius: 40px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
    @media (max-width: 768px) { .static-preview { height: 300px; } }
    @media (max-width: 480px) { .static-preview { height: 240px; } }

    /* ── Price & Discount Wrapper ── */
    .price-wrapper {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-top: 0.5rem;
    }
    .original-price { text-decoration: line-through; color: #9ca3af; font-size: 1.1rem; }
    .discount-price { color: #16a34a; font-weight: 700; font-size: 2rem; }
    .discount-percent-tag {
      background: rgba(220, 38, 38, 0.10);
      color: #dc2626;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 2px 14px;
      border-radius: 40px;
      border: 1px solid rgba(220, 38, 38, 0.12);
    }
    .price-bdt { font-size: 1.1rem; color: #6b7280; font-weight: 500; }
    .price-bdt span { font-weight: 600; color: #1c1c1e; }

    .discount-badge {
      background: #dc2626;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 4px 16px;
      border-radius: 60px;
      box-shadow: 0 4px 16px rgba(220, 38, 38, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Rate Banner ── */
    .rate-banner {
      background: rgba(0, 122, 255, 0.06);
      border: 1px solid rgba(0, 122, 255, 0.12);
      border-radius: 60px;
      padding: 6px 18px;
      font-size: 0.9rem;
      color: #1c1c1e;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .rate-banner i { color: #007AFF; }
    .rate-banner strong { font-weight: 700; color: #007AFF; }

    /* ── Buttons (page-specific variations) ── */
    .btn-try-now {
      background: linear-gradient(135deg, #FF6B6B, #EE5A24);
      color: #fff;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      box-shadow: 0 4px 16px rgba(238, 90, 36, 0.25);
    }
    .btn-try-now:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(238, 90, 36, 0.35);
    }

    /* ── Review Item ── */
    .review-item {
      border-bottom: 1px solid #f3f4f6;
      padding: 12px 0;
    }
    .review-item:last-child { border-bottom: none; }

    /* ── Try Now Overlay (Full Screen Demo) ── */
    .trynow-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-y: auto;
    }
    .trynow-overlay.open { display: flex; }
    .trynow-overlay .overlay-inner {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      max-width: 1100px;
      width: 100%;
      max-height: 92vh;
      height: 92vh;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.5);
      position: relative;
      animation: scaleIn 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    @keyframes scaleIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .trynow-overlay .close-overlay {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .trynow-overlay .close-overlay:hover { background: rgba(0,0,0,0.5); transform: scale(1.05); }
    .trynow-overlay .demo-content { flex: 1; overflow-y: auto; padding: 0; background: #fff; }
    .trynow-overlay .demo-content iframe { width: 100%; height: 100%; border: none; display: block; }
    .trynow-overlay .bottom-bar {
      flex-shrink: 0;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.3);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
      z-index: 5;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.04);
    }
    .trynow-overlay .bottom-bar::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      height: 50px;
      background: linear-gradient(to top, rgba(255,255,255,0.7) 0%, transparent 100%);
      pointer-events: none;
    }
    .trynow-overlay .bottom-bar button {
      padding: 8px 20px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      font-family: 'Inter', sans-serif;
    }
    .trynow-overlay .bottom-bar .btn-buy {
      background: linear-gradient(135deg, #34C759, #28A745);
      color: #fff;
      box-shadow: 0 4px 16px rgba(52, 199, 89, 0.25);
    }
    .trynow-overlay .bottom-bar .btn-buy:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(52, 199, 89, 0.35); }
    .trynow-overlay .bottom-bar .btn-cart {
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.2);
    }
    .trynow-overlay .bottom-bar .btn-cart:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0, 122, 255, 0.3); }
    .trynow-overlay .bottom-bar .btn-close {
      background: rgba(0,0,0,0.04);
      color: #1c1c1e;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .trynow-overlay .bottom-bar .btn-close:hover { background: rgba(0,0,0,0.08); transform: translateY(-2px); }
    @media (max-width: 640px) {
      .trynow-overlay { padding: 0.5rem; }
      .trynow-overlay .overlay-inner { border-radius: 20px; max-height: 96vh; height: 96vh; }
      .trynow-overlay .bottom-bar { padding: 8px 10px; gap: 4px; }
      .trynow-overlay .bottom-bar button { padding: 6px 14px; font-size: 0.75rem; min-height: 32px; gap: 4px; }
      .trynow-overlay .close-overlay { top: 10px; right: 12px; width: 34px; height: 34px; font-size: 1.2rem; }
    }
    @media (max-width: 480px) {
      .trynow-overlay .bottom-bar button { padding: 4px 10px; font-size: 0.65rem; min-height: 28px; gap: 3px; }
    }

    /* ── Rating Stars ── */
    .rating-stars .star {
      font-size: 2rem;
      cursor: pointer;
      transition: 0.2s;
      color: #d1d5db;
    }
    .rating-stars .star.active { color: #f59e0b; }
    .rating-stars .star:hover { transform: scale(1.2); }

    /* ── Skeleton for product detail ── */
    .skeleton-img {
      width: 100%;
      height: 300px;
      background: #e5e7eb;
      border-radius: 12px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-line {
      height: 16px;
      background: #e5e7eb;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-line.short { width: 40%; }
    .skeleton-line.medium { width: 70%; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>

    <main class="main-content">
      <section class="pt-4 pb-16 px-6 max-w-4xl mx-auto">
        <!-- Rate Banner -->
        <div id="detailRateBanner" class="rate-banner mb-4 fade-up">
          <i class="fas fa-exchange-alt"></i>
          1 USD = <strong id="detailDisplayRate">125</strong> BDT
        </div>

        <div id="productDetailContainer">
          <!-- Skeleton -->
          <div class="fade-up">
            <div class="skeleton-img"></div>
            <div class="skeleton-line medium" style="margin-top:1rem;"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-line" style="width:50%;"></div>
            <div style="display:flex; gap:1rem; margin-top:1rem;">
              <div class="skeleton-line" style="width:30%;"></div>
              <div class="skeleton-line" style="width:40%;"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <!-- ===== BACK TO TOP ===== -->
  <button class="scroll-top-btn" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>

  <!-- ===== AUTH MODAL ===== -->
  <div id="authModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 id="authModalTitle" class="text-2xl font-bold">Sign In</h3>
        <button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
      </div>
      <form id="authForm" class="space-y-4">
        <input type="email" id="authEmail" placeholder="Email" required class="form-input" />
        <div class="relative">
          <input type="password" id="authPassword" placeholder="Password" required class="form-input pr-10" />
          <button type="button" onclick="togglePasswordVisibility('authPassword')" class="absolute right-3 top-3 text-gray-400"><i class="fas fa-eye"></i></button>
        </div>
        <button type="submit" class="btn-primary w-full justify-center">Continue</button>
      </form>
      <div class="mt-4 flex flex-col gap-2">
        <button onclick="window.socialLogin('google')" class="btn-outline w-full justify-center"><i class="fab fa-google"></i> Sign in with Google</button>
      </div>
      <p class="mt-4 text-sm text-gray-500 text-center">
        <span id="authToggleText">Don't have an account?</span>
        <a href="#" id="authToggleLink" class="text-blue-600 font-medium">Sign Up</a>
      </p>
      <div id="authError" class="text-red-500 text-sm mt-2 hidden"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- ===== TRY NOW OVERLAY ===== -->
  <div class="trynow-overlay" id="trynowOverlay">
    <div class="overlay-inner">
      <button class="close-overlay" onclick="closeTryNow()" aria-label="Close">&times;</button>
      <div class="demo-content" id="demoContent">
        <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#94a3b8; font-size:1.2rem;">
          <i class="fas fa-spinner fa-spin mr-2"></i> Loading demo...
        </div>
      </div>
      <div class="bottom-bar">
        <button class="btn-buy" onclick="window.handleTryNowBuy()"><i class="fas fa-bolt"></i> Buy Now</button>
        <button class="btn-cart" onclick="window.handleTryNowCart()"><i class="fas fa-cart-plus"></i> Add to Cart</button>
        <button class="btn-close" onclick="closeTryNow()"><i class="fas fa-times"></i> Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    // ================================================================
    // IMPORTS
    // ================================================================
    import {
      renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge,
      renderCartSidebar, setLoading, renderPaymentModal
    } from './components.js';
    import {
      auth, db, collection, doc, getDoc, getDocs, addDoc, updateDoc,
      query, where, serverTimestamp, onAuthStateChanged, signOut,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signInWithPopup, googleProvider, setDoc, onSnapshot
    } from './firebase-config.js';

    // ===== RENDER COMMON =====
    renderNavbar();
    renderFooter();
    renderCartSidebar();
    renderPaymentModal();
    updateCartBadge();

    // `showToast` is globally available from components.js

    // ===== SCROLL OBSERVER =====
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    });

    // ===== BACK TO TOP =====
    const scrollBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => { scrollBtn.classList.toggle('show', window.scrollY > 400); }, { passive: true });
    scrollBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

    // ================================================================
    // AUTH MODAL (Standard)
    // ================================================================
    let currentAuthMode = 'signin';
    window.openAuthModal = (mode) => {
      currentAuthMode = mode;
      document.getElementById('authModalTitle').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
      document.getElementById('authToggleText').textContent = mode === 'signin' ? "Don't have an account?" : "Already have an account?";
      document.getElementById('authToggleLink').textContent = mode === 'signin' ? 'Sign Up' : 'Sign In';
      document.getElementById('authError').classList.add('hidden');
      document.getElementById('authModal').classList.remove('hidden');
    };
    window.closeAuthModal = () => document.getElementById('authModal').classList.add('hidden');

    document.getElementById('authToggleLink').addEventListener('click', (e) => {
      e.preventDefault();
      currentAuthMode = currentAuthMode === 'signin' ? 'signup' : 'signin';
      window.openAuthModal(currentAuthMode);
    });

    window.togglePasswordVisibility = (id) => {
      const input = document.getElementById(id);
      if (input) input.type = input.type === 'password' ? 'text' : 'password';
    };

    window.socialLogin = async (provider) => {
      if (provider !== 'google') { showToast('Only Google sign-in is supported', 'warning'); return; }
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (!userDoc.exists()) {
          await setDoc(doc(db, 'users', user.uid), {
            email: user.email || '',
            displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'User'),
            photoURL: user.photoURL || '',
            role: 'user',
            createdAt: new Date().toISOString(),
            isActive: true,
            emailVerified: !!user.emailVerified,
          });
        }
        showToast('✅ Signed in with Google', 'success');
        closeAuthModal();
      } catch (error) {
        console.error('Google sign-in error:', error);
        let msg = error.message || 'Sign-in failed';
        if (error.code === 'auth/popup-closed-by-user') msg = 'Sign-in cancelled';
        else if (error.code === 'auth/popup-blocked') msg = 'Popup blocked. Allow popups for this site.';
        else if (error.code === 'auth/unauthorized-domain') msg = 'Domain not authorized in Firebase Console.';
        else if (error.code === 'auth/operation-not-allowed') msg = 'Google sign-in is not enabled in Firebase Console.';
        showToast('⚠️ ' + msg, 'error');
        const errEl = document.getElementById('authError');
        if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
      }
    };

    const authForm = document.getElementById('authForm');
    const authSubmitBtn = authForm.querySelector('button[type="submit"]');
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const errorDiv = document.getElementById('authError');
      errorDiv.classList.add('hidden');
      setLoading(authSubmitBtn, true, 'Continue');
      try {
        let userCred;
        if (currentAuthMode === 'signin') {
          userCred = await signInWithEmailAndPassword(auth, email, password);
          showToast('✅ Signed in!', 'success');
        } else {
          userCred = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, 'users', userCred.user.uid), {
            email, displayName: email.split('@')[0], role: 'user', createdAt: new Date().toISOString()
          });
          showToast('✅ Account created!', 'success');
        }
        closeAuthModal();
        authForm.reset();
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        showToast('⚠️ ' + error.message, 'error');
      } finally { setLoading(authSubmitBtn, false); }
    });

    window.handleLogout = async () => {
      await signOut(auth);
      showToast('✅ Logged out', 'success');
      window.location.href = 'index.html';
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        const displayName = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
        updateNavbarAuth(user, displayName);
      } else {
        updateNavbarAuth(null, null);
      }
    });

    // ================================================================
    // PRODUCT DETAIL LOGIC
    // ================================================================
    const container = document.getElementById('productDetailContainer');
    let currentProductId = null;
    let currentProductData = null;
    let allDiscounts = [];
    let usdRate = 125;

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (!productId) {
      container.innerHTML = `<div class="glass-card text-center py-12 fade-up"><i class="fas fa-exclamation-circle text-4xl text-red-400 mb-4"></i><h2 class="text-2xl font-bold text-gray-900">No product specified</h2><p class="text-gray-500 mt-2">Please go back to the store and select a product.</p><a href="get-new-website.html" class="btn-primary mt-4 inline-block">← Back to Store</a></div>`;
    } else {
      currentProductId = productId;
      await loadPaymentSettings();

      // Listen for settings changes
      onSnapshot(doc(db, 'settings', 'payment'), (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.usdRate && Number(data.usdRate) > 0) {
            usdRate = Number(data.usdRate);
            document.getElementById('detailDisplayRate').textContent = usdRate;
            if (currentProductData) { renderProductDetail(currentProductData); }
          }
        }
      });

      getDocs(collection(db, 'discounts')).then(snap => {
        allDiscounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        loadProduct(productId);
      }).catch(err => { console.error('Error loading discounts:', err);
        allDiscounts = [];
        loadProduct(productId); });
    }

    function formatPriceUSD(priceUSD) { return '$' + priceUSD.toFixed(2); }
    function formatBDT(amountBDT) { return '৳' + Math.round(amountBDT).toLocaleString('en-BD'); }
    function getBDT(priceUSD) { return priceUSD * usdRate; }

    function getDiscountForProduct(product) {
      if (!allDiscounts || !allDiscounts.length) return null;
      const specific = allDiscounts.filter(d => d.type === 'specific' && d.productId === product.id);
      if (specific.length) return specific.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, specific[0]);
      if (product.category) {
        const catDiscounts = allDiscounts.filter(d => d.type === 'category' && d.category === product.category);
        if (catDiscounts.length) return catDiscounts.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, catDiscounts[0]);
      }
      const all = allDiscounts.filter(d => d.type === 'all');
      if (all.length) return all.reduce((max, d) => d.discountPercent > max.discountPercent ? d : max, all[0]);
      return null;
    }

    function renderStars(rating) {
      const full = Math.floor(rating);
      const half = rating % 1 >= 0.5 ? 1 : 0;
      let s = '';
      for (let i = 0; i < full; i++) s += '★';
      if (half) s += '☆';
      for (let i = 0; i < 5 - full - half; i++) s += '☆';
      return s;
    }

    async function loadProduct(id) {
      try {
        const docSnap = await getDoc(doc(db, 'products', id));
        if (!docSnap.exists()) {
          container.innerHTML = `<div class="glass-card text-center py-12 fade-up"><i class="fas fa-box-open text-4xl text-gray-400 mb-4"></i><h2 class="text-2xl font-bold text-gray-900">Product not found</h2><p class="text-gray-500 mt-2">The product you are looking for does not exist.</p><a href="get-new-website.html" class="btn-primary mt-4 inline-block">← Back to Store</a></div>`;
          return;
        }
        currentProductData = { id, ...docSnap.data() };
        renderProductDetail(currentProductData);
        loadReviews(id);
        document.title = `${currentProductData.name} – CodeCureBD`;
      } catch (err) {
        console.error('Error loading product:', err);
        container.innerHTML = `<div class="glass-card text-center py-12 fade-up"><i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i><h2 class="text-2xl font-bold text-gray-900">Error loading product</h2><p class="text-gray-500 mt-2">${err.message}</p><button onclick="window.location.reload()" class="btn-primary mt-4 inline-block">Retry</button></div>`;
      }
    }

    async function loadPaymentSettings() {
      try {
        const snap = await getDoc(doc(db, 'settings', 'payment'));
        if (snap.exists()) {
          const data = snap.data();
          if (data.usdRate && Number(data.usdRate) > 0) {
            usdRate = Number(data.usdRate);
            document.getElementById('detailDisplayRate').textContent = usdRate;
          }
        }
      } catch (err) { console.warn('Could not load payment settings, using default rate 125:', err); }
    }

    function renderProductDetail(product) {
      const discount = getDiscountForProduct(product);
      const desc = product.desc || product.description || '';
      const rating = product.averageRating || 0;
      const ratingCount = product.ratingCount || 0;

      let priceHtml = '';
      let badgeHtml = '';
      if (discount) {
        const percent = Math.round(discount.discountPercent);
        const discounted = product.price * (1 - discount.discountPercent / 100);
        const origFormatted = formatPriceUSD(product.price);
        const discFormatted = formatPriceUSD(discounted);
        const origBDT = getBDT(product.price);
        const discBDT = getBDT(discounted);
        priceHtml = `
          <span class="original-price">${origFormatted}</span>
          <span class="discount-price">${discFormatted}</span>
          <span class="discount-percent-tag">-${percent}%</span>
          <span class="price-bdt">(BDT <span>${formatBDT(discBDT)}</span>)</span>
        `;
        badgeHtml = `<span class="discount-badge"><i class="fas fa-tag"></i> -${percent}%</span>`;
      } else {
        const priceFormatted = formatPriceUSD(product.price);
        const bdtAmount = getBDT(product.price);
        priceHtml = `
          <span class="discount-price" style="font-size:2rem;">${priceFormatted}</span>
          <span class="price-bdt">(BDT <span>${formatBDT(bdtAmount)}</span>)</span>
        `;
      }

      const hasHtml = product.htmlContent && product.htmlContent.length > 0;
      let previewHtml = '';
      if (hasHtml) {
        const escaped = product.htmlContent.replace(/"/g, '&quot;');
        previewHtml = `
          <div class="static-preview">
            <iframe srcdoc="${escaped}" scrolling="no" style="width:117.65%; height:117.65%; border:none; transform:scale(0.85); transform-origin:top left; pointer-events:none; user-select:none; background:#fff;"></iframe>
            <div class="preview-overlay"></div>
            <div class="preview-badge"><i class="fas fa-image"></i> Preview</div>
          </div>
        `;
      } else {
        previewHtml = `
          <div class="static-preview" style="display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:#f0f2f5;">
            <i class="fas fa-file-code" style="font-size:3rem; opacity:0.3; color:#9ca3af;"></i>
            <span style="color:#9ca3af; font-size:0.95rem;">No HTML preview available</span>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="fade-up">
          <div class="glass-card" style="padding:0; overflow:hidden;">
            ${previewHtml}
            <div style="padding:1.5rem;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
                <h1 class="text-3xl font-bold text-gray-900">${product.name}</h1>
                ${badgeHtml}
              </div>
              <div class="mt-1 text-yellow-500 text-lg">
                ${renderStars(rating)} <span class="text-gray-500 text-sm">(${ratingCount} reviews)</span>
              </div>
              <div class="price-wrapper">${priceHtml}</div>
              <div class="mt-4 text-gray-700 whitespace-pre-wrap">${desc.replace(/\n/g, '<br>')}</div>
              <div class="action-buttons">
                <button onclick="window.addToCart()" class="btn-primary"><i class="fas fa-cart-plus"></i> Add to Cart</button>
                <button onclick="window.buyNow()" class="btn-primary" style="background:linear-gradient(135deg,#34C759,#28A745);"><i class="fas fa-bolt"></i> Buy Now</button>
                ${hasHtml ? `<button onclick="window.openTryNow()" class="btn-try-now"><i class="fas fa-play-circle"></i> Try Now</button>` : ''}
                <a href="get-new-website.html" class="btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
              </div>
            </div>
          </div>

          <div class="glass-card mt-8">
            <h3 class="text-xl font-bold text-gray-900 mb-4">Rate & Review</h3>
            <div class="rating-stars flex gap-2" id="ratingStars">
              <span class="star" data-val="1">☆</span>
              <span class="star" data-val="2">☆</span>
              <span class="star" data-val="3">☆</span>
              <span class="star" data-val="4">☆</span>
              <span class="star" data-val="5">☆</span>
            </div>
            <textarea id="ratingReview" rows="3" class="form-input mt-3" placeholder="Write your review..."></textarea>
            <button onclick="window.submitRating()" class="btn-primary mt-3 text-sm py-2 px-4"><i class="fas fa-paper-plane"></i> Submit Review</button>
            <div id="reviewsList" class="mt-6 space-y-2"></div>
          </div>
        </div>
      `;

      // Star rating handler
      document.querySelectorAll('#ratingStars .star').forEach(el => {
        el.addEventListener('click', () => {
          const val = parseInt(el.dataset.val);
          window.selectedRating = val;
          document.querySelectorAll('#ratingStars .star').forEach(s => {
            s.classList.toggle('active', parseInt(s.dataset.val) <= val);
          });
        });
      });

      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    }

    window.selectedRating = 0;

    // ===== CART / BUY LOGIC =====
    window.addToCart = async function() {
      if (!currentProductData) { showToast('Product not loaded', 'error'); return; }
      const product = currentProductData;
      const discount = getDiscountForProduct(product);
      let price = product.price;
      if (discount) price = product.price * (1 - discount.discountPercent / 100);
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existing = cart.find(item => item.id === product.id);
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({ id: product.id, name: product.name, price, originalPrice: product.price, imageUrl: '', quantity: 1 });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      const user = auth.currentUser;
      if (user) {
        const { updateCartInFirestore } = await import('./components.js');
        updateCartInFirestore(user.uid, cart);
      }
      updateCartBadge();
      window.updateCartUI?.();
      showToast(`✅ "${product.name}" added to cart`, 'success');
    };

    window.buyNow = async function() {
      await window.addToCart();
      setTimeout(() => {
        if (typeof window.checkout === 'function') window.checkout();
        else window.location.href = 'get-new-website.html?checkout=1';
      }, 500);
    };

    // ===== TRY NOW =====
    window.openTryNow = function() {
      const overlay = document.getElementById('trynowOverlay');
      const content = document.getElementById('demoContent');
      const htmlContent = currentProductData?.htmlContent;
      if (!htmlContent) { showToast('No demo available.', 'warning'); return; }
      const escaped = htmlContent.replace(/"/g, '&quot;');
      content.innerHTML = `<iframe id="demoIframe" style="width:100%; height:100%; border:none;" srcdoc="${escaped}"></iframe>`;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    };

    window.closeTryNow = function() {
      document.getElementById('trynowOverlay').classList.remove('open');
      document.body.style.overflow = '';
      document.getElementById('demoContent').innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#94a3b8; font-size:1.2rem;"><i class="fas fa-spinner fa-spin mr-2"></i> Loading demo...</div>`;
    };

    window.handleTryNowBuy = async function() {
      await window.addToCart();
      window.closeTryNow();
      setTimeout(() => {
        if (typeof window.checkout === 'function') window.checkout();
        else window.location.href = 'get-new-website.html?checkout=1';
      }, 500);
    };

    window.handleTryNowCart = async function() {
      await window.addToCart();
      window.closeTryNow();
      setTimeout(() => { if (typeof window.toggleCart === 'function') window.toggleCart(); }, 300);
    };

    // ===== REVIEWS =====
    async function loadReviews(productId) {
      const reviewsContainer = document.getElementById('reviewsList');
      if (!reviewsContainer) return;
      try {
        const q = query(collection(db, 'ratings'), where('productId', '==', productId));
        const snap = await getDocs(q);
        if (snap.empty) {
          reviewsContainer.innerHTML = '<p class="text-gray-400 text-sm">No reviews yet. Be the first!</p>';
          return;
        }
        let html = '';
        snap.forEach(doc => {
          const r = doc.data();
          const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
          html += `
            <div class="review-item">
              <div class="flex justify-between">
                <span class="font-semibold text-gray-900">${r.userEmail || 'Anonymous'}</span>
                <span class="text-yellow-500">${stars}</span>
              </div>
              ${r.review ? `<p class="text-sm text-gray-600 mt-1">${r.review}</p>` : ''}
              <p class="text-xs text-gray-400 mt-1">${r.timestamp?.toDate?.()?.toLocaleString() || ''}</p>
            </div>
          `;
        });
        reviewsContainer.innerHTML = html;
      } catch (_) {
        reviewsContainer.innerHTML = '<p class="text-gray-400 text-sm">Error loading reviews.</p>';
      }
    }

    window.submitRating = async function() {
      if (!currentProductData) { showToast('Product not loaded', 'error'); return; }
      if (!window.selectedRating || window.selectedRating < 1) {
        showToast('Please select a rating', 'warning');
        return;
      }
      const user = auth.currentUser;
      if (!user) { showToast('Please sign in to rate', 'warning');
        window.openAuthModal('signin'); return; }
      const review = document.getElementById('ratingReview').value.trim();
      try {
        await addDoc(collection(db, 'ratings'), {
          productId: currentProductData.id,
          userId: user.uid,
          userEmail: user.email,
          rating: window.selectedRating,
          review: review,
          timestamp: serverTimestamp()
        });
        const productRef = doc(db, 'products', currentProductData.id);
        const snap = await getDoc(productRef);
        const data = snap.data();
        const count = (data.ratingCount || 0) + 1;
        const avg = ((data.averageRating || 0) * (data.ratingCount || 0) + window.selectedRating) / count;
        await updateDoc(productRef, { averageRating: avg, ratingCount: count });
        showToast('✅ Review submitted!', 'success');
        window.selectedRating = 0;
        document.querySelectorAll('#ratingStars .star').forEach(s => s.classList.remove('active'));
        document.getElementById('ratingReview').value = '';
        loadReviews(currentProductData.id);
        renderProductDetail(currentProductData);
      } catch (err) {
        showToast('⚠️ ' + err.message, 'error');
      }
    };

    console.log('📄 Product detail page fully optimized.');
  </script>
</body>
</html>
