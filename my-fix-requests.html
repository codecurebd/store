<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>My Fix Requests – CodeCureBD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ===== PAGE-SPECIFIC STYLES (My Fix Requests) ===== */
    * { box-sizing: border-box; }
    body {
      background: #f2f4f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* ── Status Badge ── */
    .status-badge {
      padding: 4px 14px;
      border-radius: 60px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: capitalize;
      display: inline-block;
    }
    .status-badge.pending { background: #fef3c7; color: #d97706; }
    .status-badge.resolved { background: #d1fae5; color: #059669; }
    .status-badge.closed { background: #e5e7eb; color: #6b7280; }

    /* ── Priority Badge ── */
    .priority-badge {
      padding: 2px 12px;
      border-radius: 60px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .priority-badge.high { background: #fee2e2; color: #dc2626; }
    .priority-badge.medium { background: #fef3c7; color: #d97706; }
    .priority-badge.low { background: #d1fae5; color: #059669; }

    /* ── Ticket Code ── */
    .ticket-code {
      font-family: 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(0,0,0,0.04);
      padding: 2px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    /* ── Reply Box ── */
    .reply-box {
      background: #f0fdf4;
      border-left: 4px solid #22c55e;
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 12px;
      animation: fadeSlideUp 0.4s ease forwards;
    }
    .reply-box .reply-label { font-size: 0.75rem; font-weight: 600; color: #16a34a; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .reply-box .reply-text { font-size: 0.95rem; color: #1c1c1e; }
    .reply-box .reply-time { font-size: 0.7rem; color: #8e8e93; margin-top: 6px; }

    .no-reply-box {
      background: #f9fafb;
      border-left: 4px solid #d1d5db;
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 12px;
    }
    .no-reply-box .no-reply-text { font-size: 0.85rem; color: #6b7280; display: flex; align-items: center; gap: 8px; }

    /* ── Stats Cards ── */
    .stat-card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 14px;
      padding: 1rem;
      text-align: center;
      transition: all 0.3s ease;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.04); }
    .stat-card .stat-number { font-size: 2rem; font-weight: 700; color: #1c1c1e; }
    .stat-card .stat-label { font-size: 0.75rem; color: #8e8e93; margin-top: 2px; }
    .stat-card .stat-number.pending { color: #d97706; }
    .stat-card .stat-number.resolved { color: #059669; }
    .stat-card .stat-number.closed { color: #6b7280; }

    @media (max-width: 768px) {
      .stat-card .stat-number { font-size: 1.5rem; }
      .glass-card { padding: 1rem; border-radius: 12px; }
    }
    @media (max-width: 480px) {
      .stat-card .stat-number { font-size: 1.2rem; }
      .stat-card { padding: 0.75rem; }
      .ticket-code { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>

    <main class="main-content">
      <section class="pt-4 pb-16 px-6 max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex items-center gap-3 mb-2 fade-up">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
            <i class="fas fa-tools text-xl text-white"></i>
          </div>
          <h1 class="text-3xl font-bold text-gray-900">My Fix Requests</h1>
        </div>
        <p class="text-gray-500 mb-6 fade-up">Track all your website fix requests and replies from admin.</p>

        <!-- Filters -->
        <div class="flex flex-wrap gap-3 items-center mb-6 fade-up">
          <div class="relative flex-1 min-w-[200px]">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchRequests" placeholder="Search by ticket number..." class="form-input pl-10" />
          </div>
          <select id="statusFilter" class="form-input max-w-xs">
            <option value="all">All Status</option>
            <option value="pending">🟡 Pending</option>
            <option value="resolved">🟢 Resolved</option>
            <option value="closed">⚪ Closed</option>
          </select>
          <select id="priorityFilter" class="form-input max-w-xs">
            <option value="all">All Priority</option>
            <option value="high">🔴 High</option>
            <option value="medium">🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
          <button onclick="resetFilters()" class="btn-outline text-sm py-2 px-4"><i class="fas fa-undo"></i> Reset</button>
          <a href="fix-website.html" class="btn-primary text-sm py-2 px-4"><i class="fas fa-plus"></i> New Request</a>
        </div>

        <!-- Stats -->
        <div id="statsContainer" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6 fade-up">
          <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total</div></div>
          <div class="stat-card"><div class="stat-number pending" id="pendingCount">0</div><div class="stat-label">Pending</div></div>
          <div class="stat-card"><div class="stat-number resolved" id="resolvedCount">0</div><div class="stat-label">Resolved</div></div>
          <div class="stat-card"><div class="stat-number closed" id="closedCount">0</div><div class="stat-label">Closed</div></div>
        </div>

        <!-- Request List -->
        <div id="requestList" class="space-y-4"></div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <button class="scroll-top-btn" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4"><h3 id="authModalTitle" class="text-2xl font-bold">Sign In</h3><button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button></div>
      <form id="authForm" class="space-y-4">
        <input type="email" id="authEmail" placeholder="Email" required class="form-input" />
        <div class="relative"><input type="password" id="authPassword" placeholder="Password" required class="form-input pr-10" /><button type="button" onclick="togglePasswordVisibility('authPassword')" class="absolute right-3 top-3 text-gray-400"><i class="fas fa-eye"></i></button></div>
        <button type="submit" class="btn-primary w-full justify-center">Continue</button>
      </form>
      <div class="mt-4 flex flex-col gap-2"><button onclick="window.socialLogin('google')" class="btn-outline w-full justify-center"><i class="fab fa-google"></i> Sign in with Google</button></div>
      <p class="mt-4 text-sm text-gray-500 text-center"><span id="authToggleText">Don't have an account?</span><a href="#" id="authToggleLink" class="text-blue-600 font-medium">Sign Up</a></p>
      <div id="authError" class="text-red-500 text-sm mt-2 hidden"></div>
    </div>
  </div>
  <div id="toast-container"></div>

  <script type="module">
    // ================================================================
    // IMPORTS
    // ================================================================
    import {
      renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge,
      renderCartSidebar, setLoading, renderPaymentModal
    } from './components.js';
    import {
      auth, db, collection, doc, getDoc, setDoc, addDoc, getDocs,
      query, where, serverTimestamp, signOut, onAuthStateChanged,
      signInWithEmailAndPassword, createUserWithEmailAndPassword, updateDoc,
      signInWithPopup, googleProvider, onSnapshot
    } from './firebase-config.js';

    renderNavbar(); renderPaymentModal(); renderFooter(); renderCartSidebar(); updateCartBadge();

    // ===== AUTH MODAL =====
    let currentAuthMode = 'signin';
    window.openAuthModal = (mode) => {
      currentAuthMode = mode;
      document.getElementById('authModalTitle').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
      document.getElementById('authToggleText').textContent = mode === 'signin' ? "Don't have an account?" : "Already have an account?";
      document.getElementById('authToggleLink').textContent = mode === 'signin' ? 'Sign Up' : 'Sign In';
      document.getElementById('authError').classList.add('hidden');
      document.getElementById('authModal').classList.remove('hidden');
    };
    window.closeAuthModal = () => document.getElementById('authModal').classList.add('hidden');
    document.getElementById('authToggleLink').addEventListener('click', (e) => {
      e.preventDefault();
      currentAuthMode = currentAuthMode === 'signin' ? 'signup' : 'signin';
      window.openAuthModal(currentAuthMode);
    });
    window.togglePasswordVisibility = (id) => {
      const input = document.getElementById(id);
      if (input) input.type = input.type === 'password' ? 'text' : 'password';
    };
    window.socialLogin = async (provider) => {
      if (provider !== 'google') { showToast('Only Google sign-in is supported', 'warning'); return; }
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (!userDoc.exists()) {
          await setDoc(doc(db, 'users', user.uid), {
            email: user.email || '', displayName: user.displayName || user.email?.split('@')[0] || 'User',
            photoURL: user.photoURL || '', role: 'user', createdAt: new Date().toISOString(),
            isActive: true, emailVerified: !!user.emailVerified
          });
        }
        showToast('✅ Signed in with Google', 'success');
        closeAuthModal();
      } catch (error) {
        let msg = error.message || 'Sign-in failed';
        if (error.code === 'auth/popup-closed-by-user') msg = 'Sign-in cancelled';
        else if (error.code === 'auth/popup-blocked') msg = 'Popup blocked. Allow popups.';
        else if (error.code === 'auth/unauthorized-domain') msg = 'Domain not authorized.';
        else if (error.code === 'auth/operation-not-allowed') msg = 'Google sign-in not enabled.';
        showToast('⚠️ ' + msg, 'error');
        const errEl = document.getElementById('authError');
        if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
      }
    };
    const authForm = document.getElementById('authForm');
    const authSubmitBtn = authForm.querySelector('button[type="submit"]');
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const errorDiv = document.getElementById('authError');
      errorDiv.classList.add('hidden');
      setLoading(authSubmitBtn, true, 'Continue');
      try {
        let userCred;
        if (currentAuthMode === 'signin') {
          userCred = await signInWithEmailAndPassword(auth, email, password);
          showToast('✅ Signed in!', 'success');
        } else {
          userCred = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, 'users', userCred.user.uid), {
            email, displayName: email.split('@')[0], role: 'user', createdAt: new Date().toISOString()
          });
          showToast('✅ Account created!', 'success');
        }
        closeAuthModal();
        authForm.reset();
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        showToast('⚠️ ' + error.message, 'error');
      } finally { setLoading(authSubmitBtn, false); }
    });

    window.handleLogout = async () => {
      await signOut(auth);
      showToast('✅ Logged out', 'success');
      window.location.href = 'index.html';
    };

    // ================================================================
    // FIX REQUESTS LOGIC
    // ================================================================
    const requestList = document.getElementById('requestList');
    const searchInput = document.getElementById('searchRequests');
    const statusFilter = document.getElementById('statusFilter');
    const priorityFilter = document.getElementById('priorityFilter');

    let allRequests = [];
    let filteredRequests = [];
    let unsubRequests = null;

    function renderSkeletons(count = 3) {
      let html = '';
      for (let i = 0; i < count; i++) {
        html += `
          <div class="skeleton-card fade-up">
            <div class="skeleton-line short"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-line" style="width:60%;"></div>
          </div>
        `;
      }
      requestList.innerHTML = html;
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    }

    function updateStats(requests) {
      const total = requests.length;
      const pending = requests.filter(r => r.status === 'pending').length;
      const resolved = requests.filter(r => r.status === 'resolved').length;
      const closed = requests.filter(r => r.status === 'closed').length;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('resolvedCount').textContent = resolved;
      document.getElementById('closedCount').textContent = closed;
    }

    function renderRequests(requests) {
      if (!requests || !requests.length) {
        requestList.innerHTML = `
          <div class="empty-state fade-up">
            <i class="fas fa-inbox"></i>
            <h3>No fix requests found</h3>
            <p>Submit a fix request to get help from our team.</p>
            <a href="fix-website.html" class="btn-primary mt-4 inline-block"><i class="fas fa-plus"></i> Submit Request</a>
          </div>
        `;
        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
        updateStats([]);
        return;
      }

      let html = '';
      requests.forEach((r, index) => {
        const status = r.status || 'pending';
        const priority = r.priority || 'medium';
        const date = r.timestamp?.toDate?.() || new Date(r.timestamp);
        const dateStr = date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

        let replyHtml = '';
        if (r.reply && r.reply.trim()) {
          let replyTimeStr = '';
          if (r.replyTimestamp) {
            const replyDate = r.replyTimestamp.toDate ? r.replyTimestamp.toDate() : new Date(r.replyTimestamp);
            replyTimeStr = replyDate.toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          }
          replyHtml = `
            <div class="reply-box">
              <div class="reply-label"><i class="fas fa-reply"></i> Admin Reply</div>
              <div class="reply-text">${r.reply}</div>
              <div class="reply-time">${replyTimeStr}</div>
            </div>
          `;
        } else if (status === 'pending') {
          replyHtml = `
            <div class="no-reply-box">
              <div class="no-reply-text"><i class="fas fa-clock"></i> No reply yet. Our team is reviewing your request.</div>
            </div>
          `;
        }

        const categoryIcons = { speed: '🚀', error: '🐛', design: '🎨', hacking: '🔒', hosting: '☁️', other: '📌' };
        const categoryIcon = categoryIcons[r.category] || '📌';

        html += `
          <div class="glass-card request-card fade-up" style="transition-delay: ${(index % 6) * 0.05}s">
            <div class="flex flex-wrap justify-between items-start gap-3">
              <div class="flex-1 min-w-[150px]">
                <div class="flex items-center gap-3 flex-wrap">
                  <span class="ticket-code text-sm">${r.ticketNumber || 'N/A'}</span>
                  <span class="status-badge ${status}">${status}</span>
                  <span class="priority-badge ${priority}">${priority}</span>
                </div>
                <p class="text-sm font-medium text-gray-900 mt-2">
                  <span class="text-gray-500">${categoryIcon}</span>
                  ${r.problem?.substring(0, 80) || 'No description'}${r.problem?.length > 80 ? '...' : ''}
                </p>
                <p class="text-xs text-gray-400 mt-1"><i class="far fa-calendar-alt mr-1"></i> ${dateStr} at ${timeStr}</p>
                ${r.category ? `<p class="text-xs text-gray-400">Category: ${r.category}</p>` : ''}
              </div>
              <div class="text-right flex flex-col items-end gap-1">
                <span class="text-xs bg-gray-100 px-2 py-0.5 rounded-full">
                  ${r.imageLink ? `<a href="${r.imageLink}" target="_blank" class="text-blue-500 hover:underline"><i class="fas fa-image"></i> Image</a>` : 'No image'}
                </span>
              </div>
            </div>
            ${replyHtml}
          </div>
        `;
      });

      requestList.innerHTML = html;
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
      updateStats(requests);
    }

    function applyFilters() {
      const search = searchInput.value.toLowerCase().trim();
      const status = statusFilter.value;
      const priority = priorityFilter.value;

      filteredRequests = allRequests.filter(r => {
        if (search) {
          const ticket = r.ticketNumber?.toLowerCase() || '';
          const problem = r.problem?.toLowerCase() || '';
          if (!ticket.includes(search) && !problem.includes(search)) return false;
        }
        if (status !== 'all' && r.status !== status) return false;
        if (priority !== 'all' && r.priority !== priority) return false;
        return true;
      });

      renderRequests(filteredRequests);
    }

    function debounce(fn, wait) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), wait); };
    }
    const debouncedApplyFilters = debounce(applyFilters, 300);

    window.resetFilters = () => {
      searchInput.value = '';
      statusFilter.value = 'all';
      priorityFilter.value = 'all';
      applyFilters();
    };

    searchInput.addEventListener('input', debouncedApplyFilters);
    statusFilter.addEventListener('change', applyFilters);
    priorityFilter.addEventListener('change', applyFilters);

    // ===== LOAD REQUESTS (onSnapshot) =====
    function loadRequests(userId) {
      if (!userId) {
        requestList.innerHTML = `<div class="empty-state fade-up"><i class="fas fa-exclamation-triangle text-yellow-500"></i><h3>Please sign in</h3><p>Sign in to view your fix requests.</p></div>`;
        return;
      }

      renderSkeletons(3);

      if (unsubRequests) unsubRequests();

      const q = query(collection(db, 'fixRequests'), where('userId', '==', userId));

      unsubRequests = onSnapshot(q, (snapshot) => {
        allRequests = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        allRequests.sort((a, b) => {
          const ta = a.timestamp?.toDate?.()?.getTime() || new Date(a.timestamp).getTime() || 0;
          const tb = b.timestamp?.toDate?.()?.getTime() || new Date(b.timestamp).getTime() || 0;
          return tb - ta;
        });
        applyFilters();
      }, (error) => {
        console.error('Error loading fix requests:', error);
        requestList.innerHTML = `<div class="empty-state fade-up"><i class="fas fa-exclamation-circle text-red-500"></i><h3>Error loading requests</h3><p class="text-sm text-gray-400">${error.message}</p><button onclick="window.location.reload()" class="btn-primary mt-4 inline-block"><i class="fas fa-sync"></i> Retry</button></div>`;
        showToast('⚠️ Error loading fix requests: ' + error.message, 'error');
      });
    }

    // ================================================================
    // AUTH STATE
    // ================================================================
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      const displayName = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
      updateNavbarAuth(user, displayName);
      loadRequests(user.uid);
    });

    window.addEventListener('beforeunload', () => { if (unsubRequests) unsubRequests(); });

    console.log('🔧 My Fix Requests page loaded successfully.');
  </script>
</body>
</html>
