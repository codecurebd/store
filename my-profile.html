<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>My Profile – SWD Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .profile-avatar-big {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; font-weight: 700; color: white;
      flex-shrink: 0; box-shadow: 0 8px 30px rgba(102,126,234,0.3);
      transition: transform 0.3s ease;
    }
    .profile-avatar-big:hover { transform: scale(1.03); }
    .profile-avatar-big img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .skeleton-avatar { width: 100px; height: 100px; border-radius: 50%; background: #e5e7eb; animation: pulse 1.5s ease-in-out infinite; flex-shrink: 0; }
    .skeleton-line { height: 16px; background: #e5e7eb; border-radius: 8px; margin-bottom: 0.75rem; animation: pulse 1.5s ease-in-out infinite; }
    .skeleton-line.short { width: 40%; }
    .skeleton-line.medium { width: 70%; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .fade-up { opacity:0; transform:translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .fade-up.visible { opacity:1; transform:translateY(0); }
    .scroll-top-btn { position:fixed; bottom:30px; right:30px; width:50px; height:50px; border-radius:50%; background:linear-gradient(135deg,#007AFF,#5856D6); color:#fff; border:none; font-size:1.2rem; cursor:pointer; box-shadow:0 8px 30px rgba(0,122,255,0.35); z-index:999; opacity:0; transform:scale(0.8); transition: opacity 0.3s, transform 0.3s; pointer-events:none; }
    .scroll-top-btn.show { opacity:1; transform:scale(1); pointer-events:auto; }
    .scroll-top-btn:hover { transform:scale(1.05); }
    .glass-card { background: rgba(255,255,255,0.72); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.7); border-radius: 16px; padding: 1.25rem; box-shadow: 0 4px 16px rgba(0,0,0,0.02); transition: all 0.3s ease; }
    .glass-card:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.06); transform: translateY(-3px); }
    .action-card { text-align: center; padding: 1rem; transition: 0.3s; cursor: pointer; }
    .action-card .action-icon { font-size: 2rem; display: block; margin-bottom: 0.5rem; }
    .action-card .action-label { font-size: 0.85rem; color: #374151; }
    .btn-primary { background:linear-gradient(135deg,#007AFF,#5856D6); color:#fff; padding:10px 22px; border-radius:60px; font-weight:600; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none; }
    .btn-outline { background:transparent; color:#1c1c1e; padding:10px 22px; border-radius:60px; font-weight:600; border:1.5px solid rgba(60,60,67,0.08); cursor:pointer; display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,0.5); }
    .form-input { width:100%; padding:12px 16px; border:1.5px solid rgba(60,60,67,0.08); border-radius:12px; font-size:0.95rem; background:rgba(255,255,255,0.8); outline:none; }
    .form-input:focus { border-color:#007AFF; background:#fff; box-shadow:0 0 0 4px rgba(0,122,255,0.08); }
    .info-label { font-size:0.8rem; color:#8e8e93; margin-bottom:2px; }
    .info-value { font-size:1rem; font-weight:500; color:#1c1c1e; }
    .email-verify-btn { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
    .email-verify-btn:hover { background: #bfdbfe; }
    .email-verify-btn.verified { background: #d1fae5; color: #059669; border-color: #6ee7b7; cursor: default; }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>
    <main class="main-content">
      <section class="pt-28 pb-16 px-6 max-w-2xl mx-auto">
        <div class="flex items-center gap-3 mb-6 fade-up">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
            <i class="fas fa-user-circle text-xl text-white"></i>
          </div>
          <h1 class="text-3xl font-bold text-gray-900">My Profile</h1>
        </div>

        <!-- Profile Card -->
        <div class="glass-card fade-up">
          <!-- Header -->
          <div class="flex flex-col sm:flex-row items-center gap-6" id="profileHeader">
            <!-- Avatar Skeleton -->
            <div class="skeleton-avatar" id="avatarSkeleton"></div>
            <!-- Actual Avatar -->
            <div class="profile-avatar-big hidden" id="profileAvatarBig">
              <span id="avatarLetter">U</span>
            </div>
            <!-- Info -->
            <div class="flex-1 text-center sm:text-left w-full" id="profileInfo">
              <!-- Skeletons (hidden after load) -->
              <div class="skeleton-line medium" id="nameSkeleton"></div>
              <div class="skeleton-line short" id="emailSkeleton"></div>
              <div class="skeleton-line" style="width:30%;" id="roleSkeleton"></div>
              <!-- Actual data (hidden initially) -->
              <div id="profileData" class="hidden">
                <h2 id="profileDisplayName" class="text-2xl font-bold text-gray-900"></h2>
                <p id="profileEmail" class="text-gray-500"></p>
                <span id="profileRole" class="inline-block mt-1 text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full"></span>
                <!-- ===== NEW: Email Verification Status & Button ===== -->
                <div class="mt-2 flex items-center gap-3 flex-wrap">
                  <span id="emailVerifiedStatus" class="text-sm"></span>
                  <button onclick="verifyEmail()" id="verifyEmailBtn" class="btn-primary text-sm py-1.5 px-4 email-verify-btn">
                    <i class="fas fa-envelope"></i> Verify Email
                  </button>
                </div>
              </div>
            </div>
            <button onclick="toggleEditForm()" class="btn-outline text-sm py-2 px-4 flex-shrink-0" id="editToggleBtn">
              <i class="fas fa-edit"></i> Edit
            </button>
          </div>

          <hr class="my-6 border-gray-200" />

          <!-- Info Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="infoGrid">
            <div><p class="info-label"><i class="fas fa-envelope mr-2"></i>Email</p><p class="info-value" id="profileEmailDisplay">-</p></div>
            <div><p class="info-label"><i class="fas fa-phone mr-2"></i>Phone</p><p class="info-value" id="profilePhoneDisplay">Not set</p></div>
            <div><p class="info-label"><i class="fas fa-user-tag mr-2"></i>Role</p><p class="info-value" id="profileRoleDisplay">User</p></div>
            <div><p class="info-label"><i class="fas fa-calendar-alt mr-2"></i>Joined</p><p class="info-value" id="profileJoinedDisplay">-</p></div>
          </div>

          <!-- Edit Form -->
          <div id="editForm" class="hidden mt-6 pt-6 border-t border-gray-200">
            <h3 class="text-lg font-semibold text-gray-900 mb-4"><i class="fas fa-pen text-blue-500 mr-2"></i> Edit Profile</h3>
            <form id="profileEditForm" class="space-y-4">
              <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Display Name</label><input type="text" id="editDisplayName" class="form-input" placeholder="Your name" required /></div>
              <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Phone Number</label><input type="tel" id="editPhone" class="form-input" placeholder="+880 1XXX-XXXXXX" /></div>
              <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Profile Photo URL</label><input type="text" id="editPhotoURL" class="form-input" placeholder="https://example.com/photo.jpg" /><p class="text-xs text-gray-400 mt-1.5 flex items-center gap-1"><i class="fas fa-info-circle"></i> Paste a direct image URL</p></div>
              <div class="flex flex-wrap gap-3"><button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Changes</button><button type="button" onclick="toggleEditForm()" class="btn-outline">Cancel</button></div>
              <div id="editFeedback" class="text-sm hidden"></div>
            </form>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3 fade-up">
          <a href="my-orders.html" class="glass-card action-card text-center"><span class="action-icon"><i class="fas fa-box text-blue-500"></i></span><span class="action-label">My Orders</span></a>
          <a href="my-fix-requests.html" class="glass-card action-card text-center"><span class="action-icon"><i class="fas fa-tools text-orange-500"></i></span><span class="action-label">Fix Requests</span></a>
          <a href="messages.html" class="glass-card action-card text-center"><span class="action-icon"><i class="fas fa-comments text-green-500"></i></span><span class="action-label">Support Chat</span></a>
          <a href="settings.html" class="glass-card action-card text-center"><span class="action-icon"><i class="fas fa-cog text-gray-500"></i></span><span class="action-label">Settings</span></a>
        </div>

        <!-- ===== NEW: Admin Panel Link (visible only for admin) ===== -->
        <div id="adminPanelSection" class="mt-6 hidden fade-up">
          <div class="glass-card action-card text-center" style="border: 2px solid #8B5CF6; background: rgba(139,92,246,0.05);">
            <span class="action-icon"><i class="fas fa-shield-alt text-purple-600"></i></span>
            <span class="action-label font-bold text-purple-700">Admin Panel</span>
            <p class="text-sm text-gray-500 mt-1">Manage products, orders, users, and more.</p>
            <a href="admin-panel.html" class="btn-primary mt-3 text-sm py-2 px-6">
              <i class="fas fa-arrow-right"></i> Go to Admin Panel
            </a>
          </div>
        </div>
      </section>
    </main>
    <div id="footer-placeholder"></div>
  </div>

  <button class="scroll-top-btn" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>

  <!-- Auth Modal (same as before) -->
  <div id="authModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4"><h3 id="authModalTitle" class="text-2xl font-bold">Sign In</h3><button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button></div>
      <form id="authForm" class="space-y-4">
        <input type="email" id="authEmail" placeholder="Email" required class="form-input" />
        <div class="relative"><input type="password" id="authPassword" placeholder="Password" required class="form-input pr-10" /><button type="button" onclick="togglePasswordVisibility('authPassword')" class="absolute right-3 top-3 text-gray-400"><i class="fas fa-eye"></i></button></div>
        <button type="submit" class="btn-primary w-full justify-center">Continue</button>
      </form>
      <div class="mt-4 flex flex-col gap-2"><button onclick="window.socialLogin('google')" class="btn-outline w-full justify-center"><i class="fab fa-google"></i> Sign in with Google</button></div>
      <p class="mt-4 text-sm text-gray-500 text-center"><span id="authToggleText">Don't have an account?</span><a href="#" id="authToggleLink" class="text-blue-600 font-medium">Sign Up</a></p>
      <div id="authError" class="text-red-500 text-sm mt-2 hidden"></div>
    </div>
  </div>
  <div id="toast-container"></div>

  <script type="module">
    import { renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge, renderCartSidebar, setLoading, renderPaymentModal } from './components.js';
    import { 
      auth, db, doc, getDoc, setDoc, updateDoc, signOut, onAuthStateChanged, 
      signInWithEmailAndPassword, createUserWithEmailAndPassword, 
      signInWithPopup, googleProvider,
      sendEmailVerification
    } from './firebase-config.js';

    renderNavbar(); renderPaymentModal(); renderFooter(); renderCartSidebar(); updateCartBadge();

    window.showToast = (message, type = 'success') => {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 400); }, 4500);
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.fade-up').forEach(el => observer.observe(el)); });

    const scrollBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => { scrollBtn.classList.toggle('show', window.scrollY > 400); });
    scrollBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

    // Auth Modal (same as before)
    let currentAuthMode = 'signin';
    window.openAuthModal = (mode) => {
      currentAuthMode = mode;
      document.getElementById('authModalTitle').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
      document.getElementById('authToggleText').textContent = mode === 'signin' ? "Don't have an account?" : "Already have an account?";
      document.getElementById('authToggleLink').textContent = mode === 'signin' ? 'Sign Up' : 'Sign In';
      document.getElementById('authError').classList.add('hidden');
      document.getElementById('authModal').classList.remove('hidden');
    };
    window.closeAuthModal = () => document.getElementById('authModal').classList.add('hidden');
    document.getElementById('authToggleLink').addEventListener('click', (e) => {
      e.preventDefault();
      currentAuthMode = currentAuthMode === 'signin' ? 'signup' : 'signin';
      window.openAuthModal(currentAuthMode);
    });
    window.togglePasswordVisibility = (id) => {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    };
        window.socialLogin = async (provider) => {
          if (provider !== 'google') {
            showToast('Only Google sign-in is supported', 'warning');
            return;
          }
          try {
            const result = await signInWithPopup(auth, googleProvider);
            const user = result.user;
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (!userDoc.exists()) {
              await setDoc(doc(db, 'users', user.uid), {
                email: user.email || '',
                displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'User'),
                photoURL: user.photoURL || '',
                role: 'user',
                createdAt: new Date().toISOString(),
                isActive: true,
                emailVerified: !!user.emailVerified,
              });
            }
            showToast('✅ Signed in with Google', 'success');
            if (typeof closeAuthModal === 'function') closeAuthModal();
            else if (typeof window.closeAuthModal === 'function') window.closeAuthModal();
          } catch (error) {
            console.error('Google sign-in error:', error);
            let msg = error.message || 'Sign-in failed';
            if (error.code === 'auth/popup-closed-by-user') msg = 'Sign-in cancelled';
            else if (error.code === 'auth/popup-blocked') msg = 'Popup blocked. Allow popups for this site.';
            else if (error.code === 'auth/unauthorized-domain') msg = 'Domain not authorized in Firebase Console.';
            else if (error.code === 'auth/operation-not-allowed') msg = 'Google sign-in is not enabled in Firebase Console.';
            showToast('⚠️ ' + msg, 'error');
            const errEl = document.getElementById('authError');
            if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
          }
        };
    const authForm = document.getElementById('authForm');
    const authSubmitBtn = authForm.querySelector('button[type="submit"]');
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const errorDiv = document.getElementById('authError');
      errorDiv.classList.add('hidden');
      setLoading(authSubmitBtn, true, 'Continue');
      try {
        let userCred;
        if (currentAuthMode === 'signin') {
          userCred = await signInWithEmailAndPassword(auth, email, password);
          showToast('✅ Signed in!', 'success');
        } else {
          userCred = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, 'users', userCred.user.uid), {
            email, displayName: email.split('@')[0], role: 'user', createdAt: new Date().toISOString()
          });
          showToast('✅ Account created!', 'success');
        }
        closeAuthModal();
        authForm.reset();
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        showToast('⚠️ ' + error.message, 'error');
      } finally { setLoading(authSubmitBtn, false); }
    });

    window.handleLogout = async () => {
      await signOut(auth);
      showToast('✅ Logged out', 'success');
      window.location.href = 'index.html';
    };

    // ===== PROFILE LOGIC =====
    const profileDisplayName = document.getElementById('profileDisplayName');
    const profileEmail = document.getElementById('profileEmail');
    const profileRole = document.getElementById('profileRole');
    const profileEmailDisplay = document.getElementById('profileEmailDisplay');
    const profilePhoneDisplay = document.getElementById('profilePhoneDisplay');
    const profileRoleDisplay = document.getElementById('profileRoleDisplay');
    const profileJoinedDisplay = document.getElementById('profileJoinedDisplay');
    const profileAvatarBig = document.getElementById('profileAvatarBig');
    const avatarLetter = document.getElementById('avatarLetter');
    const editForm = document.getElementById('editForm');
    const editDisplayName = document.getElementById('editDisplayName');
    const editPhone = document.getElementById('editPhone');
    const editPhotoURL = document.getElementById('editPhotoURL');
    const editFeedback = document.getElementById('editFeedback');
    const editToggleBtn = document.getElementById('editToggleBtn');
    const profileData = document.getElementById('profileData');
    const nameSkeleton = document.getElementById('nameSkeleton');
    const emailSkeleton = document.getElementById('emailSkeleton');
    const roleSkeleton = document.getElementById('roleSkeleton');
    const avatarSkeleton = document.getElementById('avatarSkeleton');
    const adminPanelSection = document.getElementById('adminPanelSection');
    const emailVerifiedStatus = document.getElementById('emailVerifiedStatus');
    const verifyEmailBtn = document.getElementById('verifyEmailBtn');

    function setLoadingState(isLoading) {
      if (isLoading) {
        avatarSkeleton.classList.remove('hidden');
        profileAvatarBig.classList.add('hidden');
        nameSkeleton.classList.remove('hidden');
        emailSkeleton.classList.remove('hidden');
        roleSkeleton.classList.remove('hidden');
        profileData.classList.add('hidden');
      } else {
        avatarSkeleton.classList.add('hidden');
        profileAvatarBig.classList.remove('hidden');
        nameSkeleton.classList.add('hidden');
        emailSkeleton.classList.add('hidden');
        roleSkeleton.classList.add('hidden');
        profileData.classList.remove('hidden');
      }
    }

    // ===== NEW: Email Verification =====
    window.verifyEmail = async () => {
      const user = auth.currentUser;
      if (!user) { showToast('Not logged in', 'error'); return; }
      if (user.emailVerified) {
        showToast('✅ Email already verified', 'success');
        updateEmailVerificationUI(true);
        return;
      }
      try {
        await sendEmailVerification(user);
        showToast('📧 Verification email sent! Check your inbox.', 'success');
      } catch (err) {
        showToast('⚠️ ' + err.message, 'error');
      }
    };

    function updateEmailVerificationUI(isVerified) {
      const status = document.getElementById('emailVerifiedStatus');
      const btn = document.getElementById('verifyEmailBtn');
      if (isVerified) {
        status.innerHTML = '<span class="text-green-600"><i class="fas fa-check-circle"></i> Verified</span>';
        btn.innerHTML = '<i class="fas fa-check"></i> Verified';
        btn.className = 'btn-primary text-sm py-1.5 px-4 email-verify-btn verified';
        btn.disabled = true;
      } else {
        status.innerHTML = '<span class="text-yellow-600"><i class="fas fa-exclamation-circle"></i> Not verified</span>';
        btn.innerHTML = '<i class="fas fa-envelope"></i> Verify Email';
        btn.className = 'btn-primary text-sm py-1.5 px-4 email-verify-btn';
        btn.disabled = false;
      }
    }

    async function loadProfile(user) {
      if (!user) { window.location.href = 'index.html'; return; }
      setLoadingState(true);
      try {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (userDoc.exists()) {
          const data = userDoc.data();
          const name = data.displayName || user.email?.split('@')[0] || 'User';
          const role = data.role || 'user';
          const email = data.email || user.email || 'No email';

          // Update header
          profileDisplayName.textContent = name;
          profileEmail.textContent = email;
          profileRole.textContent = role.charAt(0).toUpperCase() + role.slice(1);
          if (role !== 'admin') {
            profileRole.style.display = 'none';
          } else {
            profileRole.style.display = 'inline-block';
          }

          // Update info grid
          profileEmailDisplay.textContent = email;
          profilePhoneDisplay.textContent = data.phone || 'Not set';
          profileRoleDisplay.textContent = role.charAt(0).toUpperCase() + role.slice(1);
          if (data.createdAt) {
            const date = new Date(data.createdAt);
            profileJoinedDisplay.textContent = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          }

          // Avatar
          avatarLetter.textContent = name.charAt(0).toUpperCase();
          if (data.photoURL) {
            profileAvatarBig.innerHTML = `<img src="${data.photoURL}" alt="${name}" loading="lazy" />`;
          } else {
            profileAvatarBig.innerHTML = `<span id="avatarLetter">${name.charAt(0).toUpperCase()}</span>`;
          }

          // Edit form
          editDisplayName.value = name;
          editPhone.value = data.phone || '';
          editPhotoURL.value = data.photoURL || '';

          // ✅ Admin Panel Section visibility
          if (role === 'admin') {
            adminPanelSection.classList.remove('hidden');
            adminPanelSection.classList.add('fade-up');
            observer.observe(adminPanelSection);
          } else {
            adminPanelSection.classList.add('hidden');
          }

          // ✅ Email verification status
          updateEmailVerificationUI(user.emailVerified);

          // Navbar
          updateNavbarAuth(user, name);

          // Set title
          document.title = `${name} – Profile`;
        } else {
          await setDoc(doc(db, 'users', user.uid), {
            email: user.email,
            displayName: user.email?.split('@')[0] || 'User',
            role: 'user',
            createdAt: new Date().toISOString()
          });
          loadProfile(user);
        }
      } catch (err) {
        console.error('Profile load error:', err);
        showToast('⚠️ Error loading profile: ' + err.message, 'error');
      } finally {
        setLoadingState(false);
      }
    }

    window.toggleEditForm = () => {
      editForm.classList.toggle('hidden');
      if (!editForm.classList.contains('hidden')) {
        editFeedback.className = 'hidden';
        editToggleBtn.innerHTML = '<i class="fas fa-times"></i> Close';
      } else {
        editToggleBtn.innerHTML = '<i class="fas fa-edit"></i> Edit';
      }
    };

    const profileEditForm = document.getElementById('profileEditForm');
    const profileEditBtn = profileEditForm.querySelector('button[type="submit"]');
    profileEditForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newName = editDisplayName.value.trim();
      const phone = editPhone.value.trim();
      const photoURL = editPhotoURL.value.trim();
      editFeedback.className = 'hidden';
      if (!newName) {
        editFeedback.className = 'block text-sm text-red-500 mt-2';
        editFeedback.textContent = '⚠️ Please enter a display name.';
        showToast('Please enter a display name', 'error');
        return;
      }
      const user = auth.currentUser;
      if (!user) { showToast('Not logged in', 'error'); return; }
      setLoading(profileEditBtn, true, 'Saving...');
      try {
        await updateDoc(doc(db, 'users', user.uid), { displayName: newName, phone: phone || '', photoURL: photoURL || '' });
        await loadProfile(user);
        showToast('✅ Profile updated!', 'success');
        editForm.classList.add('hidden');
        editToggleBtn.innerHTML = '<i class="fas fa-edit"></i> Edit';
      } catch (err) {
        editFeedback.className = 'block text-sm text-red-500 mt-2';
        editFeedback.textContent = '⚠️ ' + err.message;
        showToast('⚠️ Error: ' + err.message, 'error');
      } finally { setLoading(profileEditBtn, false); }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      await loadProfile(user);
    });

    console.log('👤 Profile page loaded successfully!');
  </script>
</body>
</html>
