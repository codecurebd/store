<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Messages – SWD Store</title>
  
  <!-- ✅ Preconnect & Preload for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* ===== BASE ===== */
    * { box-sizing: border-box; }
    body {
      background: #f2f4f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* ===== FONT DISPLAY SWAP ===== */
    @font-face {
      font-family: 'Inter';
      font-display: swap;
    }

    /* ===== GLASS CARD ===== */
    .glass-card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
    }

    /* ===== MESSENGER ===== */
    .messenger-wrap {
      display: flex;
      flex-direction: column;
      height: 70vh;
      min-height: 460px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(0,0,0,0.04);
    }

    /* ===== CHAT HEADER ===== */
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .chat-header .chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .chat-header .chat-info {
      flex: 1;
    }
    .chat-header .chat-info .name {
      font-weight: 600;
      color: #1c1c1e;
      font-size: 1.05rem;
    }
    .chat-header .chat-info .status {
      font-size: 0.75rem;
      color: #34C759;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .chat-header .chat-info .status .dot {
      width: 8px;
      height: 8px;
      background: #34C759;
      border-radius: 50%;
      display: inline-block;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== CHAT MESSAGES ===== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(248, 249, 252, 0.6);
    }

    /* ===== MESSAGE BUBBLE ===== */
    .chat-msg {
      max-width: 78%;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      word-wrap: break-word;
      animation: fadeUp 0.25s ease;
      position: relative;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }
    .chat-msg.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.received {
      align-self: flex-start;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      color: #1c1c1e;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255,255,255,0.6);
    }
    .chat-msg .msg-time {
      font-size: 0.6rem;
      opacity: 0.6;
      margin-top: 6px;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }
    .chat-msg.sent .msg-time {
      color: rgba(255,255,255,0.7);
    }
    .chat-msg .msg-status {
      font-size: 0.6rem;
      opacity: 0.6;
      margin-left: 4px;
    }

    /* ===== CHAT INPUT ===== */
    .chat-input-wrap {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      border-top: 1px solid rgba(0,0,0,0.04);
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .chat-input-wrap input {
      flex: 1;
      padding: 12px 20px;
      border-radius: 30px;
      border: 1.5px solid rgba(60,60,67,0.08);
      font-size: 0.95rem;
      transition: 0.2s;
      background: rgba(255,255,255,0.8);
      outline: none;
    }
    .chat-input-wrap input:focus {
      border-color: #007AFF;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0,122,255,0.06);
    }
    .chat-input-wrap input::placeholder {
      color: #8e8e93;
      opacity: 0.7;
    }
    .chat-input-wrap button {
      border-radius: 50%;
      width: 50px;
      height: 50px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      font-size: 1.2rem;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(0,122,255,0.2);
    }
    .chat-input-wrap button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,122,255,0.3);
    }
    .chat-input-wrap button:disabled {
      opacity: 0.5;
      transform: none !important;
      box-shadow: none !important;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8e8e93;
      font-size: 0.95rem;
      flex-direction: column;
      gap: 10px;
    }
    .empty-state i {
      font-size: 2.8rem;
      opacity: 0.3;
    }

    /* ===== SKELETON ===== */
    .skeleton-msg {
      height: 54px;
      background: #e5e7eb;
      border-radius: 12px;
      margin-bottom: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .skeleton-msg.sent {
      align-self: flex-end;
      width: 60%;
      border-bottom-right-radius: 4px;
    }
    .skeleton-msg.received {
      align-self: flex-start;
      width: 70%;
      border-bottom-left-radius: 4px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== SCROLLBAR ===== */
    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #d0d0d5;
      border-radius: 10px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .messenger-wrap {
        height: 75vh;
        min-height: 400px;
        border-radius: 16px;
      }
      .chat-header {
        padding: 12px 16px;
      }
      .chat-messages {
        padding: 14px 16px;
      }
      .chat-msg {
        max-width: 92%;
        font-size: 0.9rem;
        padding: 10px 14px;
      }
      .chat-input-wrap {
        padding: 12px 16px;
        gap: 10px;
      }
      .chat-input-wrap input {
        padding: 10px 16px;
        font-size: 0.9rem;
      }
      .chat-input-wrap button {
        width: 46px;
        height: 46px;
        font-size: 1rem;
      }
    }
    @media (max-width: 480px) {
      .chat-header .chat-avatar {
        width: 36px;
        height: 36px;
        font-size: 0.9rem;
      }
      .chat-header .chat-info .name {
        font-size: 0.95rem;
      }
    }

    /* ===== FADE-UP ===== */
    .fade-up {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== BACK TO TOP ===== */
    .scroll-top-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0,122,255,0.35);
      z-index: 999;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    .scroll-top-btn.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .scroll-top-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>

    <main class="main-content">
      <section class="pt-28 pb-16 px-6 max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-2 fade-up">Support Chat</h1>
        <p class="text-gray-500 mb-6 fade-up">Chat directly with our support team.</p>

        <div class="messenger-wrap fade-up">
          <!-- Chat Header -->
          <div class="chat-header">
            <div class="chat-avatar"><i class="fas fa-headset"></i></div>
            <div class="chat-info">
              <div class="name">Admin Support</div>
              <div class="status"><span class="dot"></span> Online</div>
            </div>
          </div>

          <!-- Chat Messages -->
          <div class="chat-messages" id="chatMessages">
            <!-- Skeleton will be replaced by JS -->
            <div class="skeleton-msg received"></div>
            <div class="skeleton-msg sent"></div>
            <div class="skeleton-msg received" style="width:50%;"></div>
          </div>

          <!-- Chat Input -->
          <form class="chat-input-wrap" id="chatForm">
            <input type="text" id="chatInput" placeholder="Type a message..." required autocomplete="off" />
            <button type="submit" id="chatSendBtn"><i class="fas fa-paper-plane"></i></button>
          </form>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <!-- ===== BACK TO TOP ===== -->
  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Back to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- ===== AUTH MODAL ===== -->
  <div id="authModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 id="authModalTitle" class="text-2xl font-bold">Sign In</h3>
        <button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
      </div>
      <form id="authForm" class="space-y-4">
        <input type="email" id="authEmail" placeholder="Email" required class="form-input" />
        <div class="relative">
          <input type="password" id="authPassword" placeholder="Password" required class="form-input pr-10" />
          <button type="button" onclick="togglePasswordVisibility('authPassword')" class="absolute right-3 top-3 text-gray-400"><i class="fas fa-eye"></i></button>
        </div>
        <button type="submit" class="btn-primary w-full justify-center">Continue</button>
      </form>
      <div class="mt-4 flex flex-col gap-2">
        <button onclick="window.socialLogin('google')" class="btn-outline w-full justify-center"><i class="fab fa-google"></i> Sign in with Google</button>
        <button onclick="window.socialLogin('github')" class="btn-outline w-full justify-center"><i class="fab fa-github"></i> Sign in with GitHub</button>
      </div>
      <p class="mt-4 text-sm text-gray-500 text-center">
        <span id="authToggleText">Don't have an account?</span>
        <a href="#" id="authToggleLink" class="text-blue-600 font-medium">Sign Up</a>
      </p>
      <div id="authError" class="text-red-500 text-sm mt-2 hidden"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    // ================================================================
    // ইমপোর্ট
    // ================================================================
    import { 
      auth, db, collection, doc, getDoc, setDoc, addDoc, onSnapshot, 
      query, where, serverTimestamp, signOut, onAuthStateChanged,
      signInWithEmailAndPassword, createUserWithEmailAndPassword, updateDoc,
      signInWithPopup, googleProvider, githubProvider
    } from './firebase-config.js';
    import { 
      renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge, 
      renderCartSidebar, setLoading, renderPaymentModal
    } from './components.js';

    // ===== রেন্ডার =====
    renderNavbar();
    renderFooter();
    renderCartSidebar();
    renderPaymentModal();
    updateCartBadge();

    // ===== টোস্ট =====
    window.showToast = (message, type = 'success') => {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 400); }, 4500);
    };

    // ===== SCROLL ANIMATION =====
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    });

    // ===== BACK TO TOP =====
    const scrollBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) {
        scrollBtn.classList.add('show');
      } else {
        scrollBtn.classList.remove('show');
      }
    });
    scrollBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ===== AUTH MODAL LOGIC (আগের মতো) =====
    let currentAuthMode = 'signin';
    window.openAuthModal = (mode) => {
      currentAuthMode = mode;
      document.getElementById('authModalTitle').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
      document.getElementById('authToggleText').textContent = mode === 'signin' ? "Don't have an account?" : "Already have an account?";
      document.getElementById('authToggleLink').textContent = mode === 'signin' ? 'Sign Up' : 'Sign In';
      document.getElementById('authError').classList.add('hidden');
      document.getElementById('authModal').classList.remove('hidden');
    };
    window.closeAuthModal = () => document.getElementById('authModal').classList.add('hidden');

    document.getElementById('authToggleLink').addEventListener('click', (e) => {
      e.preventDefault();
      currentAuthMode = currentAuthMode === 'signin' ? 'signup' : 'signin';
      window.openAuthModal(currentAuthMode);
    });

    window.togglePasswordVisibility = (id) => {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    };

    const authForm = document.getElementById('authForm');
    const authSubmitBtn = authForm.querySelector('button[type="submit"]');
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const errorDiv = document.getElementById('authError');
      errorDiv.classList.add('hidden');
      setLoading(authSubmitBtn, true, 'Continue');
      try {
        let userCred;
        if (currentAuthMode === 'signin') {
          userCred = await signInWithEmailAndPassword(auth, email, password);
          showToast('✅ Signed in!', 'success');
        } else {
          userCred = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, 'users', userCred.user.uid), {
            email, displayName: email.split('@')[0], role: 'user', createdAt: new Date().toISOString()
          });
          showToast('✅ Account created!', 'success');
        }
        closeAuthModal();
        authForm.reset();
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        showToast('⚠️ ' + error.message, 'error');
      } finally {
        setLoading(authSubmitBtn, false);
      }
    });

    window.socialLogin = async (provider) => {
      try {
        let result;
        if (provider === 'google') result = await signInWithPopup(auth, googleProvider);
        else if (provider === 'github') result = await signInWithPopup(auth, githubProvider);
        const user = result.user;
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (!userDoc.exists()) {
          await setDoc(doc(db, 'users', user.uid), {
            email: user.email,
            displayName: user.displayName || user.email.split('@')[0],
            role: 'user',
            createdAt: new Date().toISOString()
          });
        }
        showToast('✅ Signed in with ' + provider, 'success');
        closeAuthModal();
      } catch (err) {
        showToast('⚠️ ' + err.message, 'error');
      }
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      const displayName = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
      updateNavbarAuth(user, displayName);
      // Start chat after auth
      initChat(user);
    });

    window.handleLogout = async () => {
      await signOut(auth);
      showToast('✅ Logged out', 'success');
      window.location.href = 'index.html';
    };

    // ================================================================
    // ✅ চ্যাট লজিক (UI ইমপ্রুভ সহ)
    // ================================================================
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');
    let currentUser = null;
    let conversationId = null;
    let unsubMessages = null;

    function renderMessages(msgs) {
      if (!msgs || msgs.length === 0) {
        chatMessages.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-comment-dots"></i>
            <span>No messages yet. Start the conversation!</span>
          </div>
        `;
        return;
      }
      let html = '';
      msgs.forEach(m => {
        const isSent = m.fromUserId === currentUser?.uid;
        const time = m.timestamp?.toDate?.()?.toLocaleString('en-US', { 
          hour: '2-digit', 
          minute: '2-digit',
          month: 'short',
          day: 'numeric'
        }) || '';
        let statusHtml = '';
        if (isSent) {
          const readStatus = m.read ? '✓✓' : '✓';
          statusHtml = `<span class="msg-status">${readStatus}</span>`;
        }
        html += `
          <div class="chat-msg ${isSent ? 'sent' : 'received'}">
            ${m.content}
            <div class="msg-time">
              ${time} ${statusHtml}
            </div>
          </div>
        `;
      });
      chatMessages.innerHTML = html;
      // Auto-scroll to bottom
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Show skeleton while loading
    function showSkeletons() {
      chatMessages.innerHTML = `
        <div class="skeleton-msg received"></div>
        <div class="skeleton-msg sent"></div>
        <div class="skeleton-msg received" style="width:50%;"></div>
      `;
    }

    async function initChat(user) {
      if (!user) return;
      currentUser = user;
      conversationId = `conv_${user.uid}_admin`;

      // Unsubscribe previous listener if any
      if (unsubMessages) unsubMessages();

      // Show skeletons
      showSkeletons();

      // Listen for messages
      const q = query(
        collection(db, 'messages'),
        where('conversationId', '==', conversationId)
      );

      unsubMessages = onSnapshot(q, (snapshot) => {
        const msgs = [];
        snapshot.forEach(doc => {
          msgs.push({ id: doc.id, ...doc.data() });
        });
        // Sort by timestamp
        msgs.sort((a, b) => {
          const ta = a.timestamp?.toDate?.()?.getTime() || 0;
          const tb = b.timestamp?.toDate?.()?.getTime() || 0;
          return ta - tb;
        });
        renderMessages(msgs);

        // Mark admin messages as read if user is viewing
        const unreadAdminMsgs = msgs.filter(m => m.fromUserId === 'admin' && !m.read);
        if (unreadAdminMsgs.length > 0) {
          unreadAdminMsgs.forEach(async (m) => {
            await updateDoc(doc(db, 'messages', m.id), { 
              read: true, 
              readAt: serverTimestamp() 
            });
          });
        }
      }, (error) => {
        console.error('Snapshot error:', error);
        showToast('Error loading messages: ' + error.message, 'error');
        chatMessages.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle text-red-500"></i>
            <span>Error loading messages. Please refresh.</span>
          </div>
        `;
      });
    }

    // ===== SEND MESSAGE =====
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = chatInput.value.trim();
      if (!content) return;
      if (!currentUser) {
        showToast('Please sign in first.', 'warning');
        return;
      }
      if (!conversationId) {
        showToast('Conversation not ready. Please refresh.', 'error');
        return;
      }

      setLoading(chatSendBtn, true);
      try {
        await addDoc(collection(db, 'messages'), {
          conversationId: conversationId,
          fromUserId: currentUser.uid,
          toUserId: 'admin',
          content,
          timestamp: serverTimestamp(),
          read: false,
          participants: [currentUser.uid, 'admin']
        });
        chatInput.value = '';
        // Focus after send
        chatInput.focus();
      } catch (err) {
        console.error('Send error:', err);
        showToast('Error sending message: ' + err.message, 'error');
      } finally {
        setLoading(chatSendBtn, false);
      }
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (unsubMessages) unsubMessages();
    });

    console.log('💬 Messages page loaded successfully!');
  </script>
</body>
</html>
