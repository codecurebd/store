<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Website Maintenance Dashboard | CodeCureBD</title>
  <meta name="description" content="Manage your website maintenance — uptime, backups, security, performance, and more. Free for the first 3 months after every project delivery." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tailwind.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    * { box-sizing: border-box; }
    body {
      background: #f0f4f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      min-height: 100vh;
      color: #0f172a;
    }

    /* ===== HERO ===== */
    .maint-hero {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      padding: 2.25rem 1.75rem;
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(0,102,255,0.12), transparent 50%),
        radial-gradient(ellipse 60% 50% at 90% 80%, rgba(139,92,246,0.12), transparent 50%),
        linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 8px 40px rgba(0,102,255,0.06);
      margin-bottom: 1.5rem;
    }
    .maint-hero h1 {
      font-size: clamp(1.65rem, 4vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #0f172a;
      line-height: 1.15;
      margin: 0.5rem 0 0.75rem;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(0,102,255,0.08);
      color: #0066FF;
      border: 1px solid rgba(0,102,255,0.12);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .hero-badge.trial {
      background: rgba(22,163,74,0.1);
      color: #16a34a;
      border-color: rgba(22,163,74,0.2);
    }
    .hero-badge.active {
      background: rgba(37,99,235,0.1);
      color: #2563eb;
      border-color: rgba(37,99,235,0.2);
    }
    .hero-badge.expired {
      background: rgba(220,38,38,0.1);
      color: #dc2626;
      border-color: rgba(220,38,38,0.2);
    }
    .hero-badge.warning {
      background: rgba(245,158,11,0.12);
      color: #d97706;
      border-color: rgba(245,158,11,0.22);
      animation: pulseBadge 2s ease-in-out infinite;
    }
    @keyframes pulseBadge {
      0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.2); }
      50% { box-shadow: 0 0 0 6px rgba(245,158,11,0); }
    }

    .maint-hero .hero-sub {
      color: #475569;
      font-size: 0.98rem;
      line-height: 1.65;
      max-width: 720px;
      margin: 0;
    }

    .maint-hero .stat-pill {
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(0,0,0,0.04);
      min-width: 110px;
    }
    .maint-hero .stat-pill .sv {
      font-size: 1.2rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.1;
    }
    .maint-hero .stat-pill .sl {
      font-size: 0.68rem;
      color: #64748b;
      font-weight: 600;
      margin-top: 3px;
    }

    /* ===== SECTION HEADER ===== */
    .section-head { margin-bottom: 1.25rem; }
    .section-head h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin: 0 0 4px;
    }
    .section-head p {
      font-size: 0.9rem;
      color: #64748b;
      margin: 0;
    }
    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #0066FF;
      background: rgba(0,102,255,0.08);
      padding: 4px 12px;
      border-radius: 40px;
      margin-bottom: 0.6rem;
    }

    /* ===== GLASS CARD ===== */
    .glass-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 18px;
      padding: 1.35rem;
      box-shadow: 0 4px 20px rgba(15,23,42,0.03);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 44px rgba(15,23,42,0.06);
    }

    /* ===== LOADING STATE (center-focused, fills viewport below hero) ===== */
    .maint-loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* ✅ Fill remaining viewport below navbar + hero + spacing, with sensible floor */
      min-height: max(320px, calc(100vh - 520px));
      padding: 2rem 1.5rem;
      gap: 1.15rem;
      background: #ffffff;
      border-radius: 22px;
      border: 1px solid rgba(15,23,42,0.06);
      box-shadow: 0 4px 20px rgba(15,23,42,0.03);
      text-align: center;
    }
    .maint-loading-state .loading-spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(37,99,235,0.12);
      border-top-color: #2563eb;
      border-right-color: #7c3aed;
      border-radius: 50%;
      animation: maintSpin 0.85s linear infinite;
      flex-shrink: 0;
    }
    @keyframes maintSpin {
      to { transform: rotate(360deg); }
    }
    .maint-loading-state .loading-label {
      color: #334155;
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .maint-loading-state .loading-sub {
      color: #94a3b8;
      font-size: 0.8rem;
      margin: 0;
      font-weight: 500;
    }
    @media (prefers-reduced-motion: reduce) {
      .maint-loading-state .loading-spinner { animation-duration: 1.4s; }
    }

    /* ===== BUTTONS ===== */
    .btn-primary {
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 0.92rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      text-decoration: none;
      font-family: inherit;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 122, 255, 0.35);
    }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
    .btn-outline {
      background: rgba(255,255,255,0.7);
      color: #1c1c1e;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.92rem;
      border: 1.5px solid rgba(60,60,67,0.08);
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      text-decoration: none;
      font-family: inherit;
    }
    .btn-outline:hover {
      background: #fff;
      border-color: #007AFF;
      color: #007AFF;
      transform: translateY(-2px);
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 3.5rem 1.5rem;
      background: #fff;
      border: 1px dashed rgba(15,23,42,0.1);
      border-radius: 22px;
    }
    .empty-state i.big-icon {
      font-size: 3.5rem;
      opacity: 0.25;
      color: #64748b;
      display: block;
      margin-bottom: 1rem;
    }
    .empty-state h3 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    .empty-state p {
      font-size: 0.92rem;
      color: #64748b;
      max-width: 520px;
      margin: 0 auto 1.5rem;
      line-height: 1.6;
    }
    .empty-state .empty-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    /* ===== FEATURE GRID ===== */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 1.5rem;
      text-align: left;
    }
    .feature-card {
      background: #fff;
      border: 1px solid rgba(15,23,42,0.06);
      border-radius: 16px;
      padding: 1.15rem 1rem;
      transition: 0.25s;
    }
    .feature-card:hover {
      transform: translateY(-4px);
      border-color: rgba(37,99,235,0.15);
      box-shadow: 0 14px 36px rgba(15,23,42,0.06);
    }
    .feature-card .fc-icon {
      width: 42px; height: 42px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1rem; margin-bottom: 0.75rem;
    }
    .feature-card h4 {
      font-size: 0.92rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }
    .feature-card p {
      font-size: 0.8rem;
      color: #64748b;
      margin: 0;
      line-height: 1.5;
    }

    /* ===== DASHBOARD TABS ===== */
    .maint-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(15,23,42,0.05);
      border-radius: 14px;
      padding: 6px;
      margin-bottom: 1.25rem;
    }
    .maint-tab {
      flex: 1;
      min-width: 110px;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    .maint-tab:hover { color: #2563eb; background: rgba(37,99,235,0.04); }
    .maint-tab.active {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37,99,235,0.25);
    }
    .maint-tab i { font-size: 0.8rem; }
    .maint-panel { display: none; }
    .maint-panel.active { display: block; animation: fadeSlideUp 0.35s ease; }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== SUBSCRIPTION BANNER ===== */
    .sub-banner {
      border-radius: 18px;
      padding: 1.25rem 1.4rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      border: 1.5px solid;
      position: relative;
      overflow: hidden;
    }
    .sub-banner.trial {
      background: linear-gradient(135deg, rgba(22,163,74,0.08), rgba(255,255,255,0.9));
      border-color: rgba(22,163,74,0.25);
    }
    .sub-banner.active {
      background: linear-gradient(135deg, rgba(37,99,235,0.08), rgba(255,255,255,0.9));
      border-color: rgba(37,99,235,0.25);
    }
    .sub-banner.expired {
      background: linear-gradient(135deg, rgba(220,38,38,0.08), rgba(255,255,255,0.9));
      border-color: rgba(220,38,38,0.25);
    }
    .sub-banner .sb-icon {
      width: 52px; height: 52px; border-radius: 15px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: #fff; flex-shrink: 0;
    }
    .sub-banner.trial .sb-icon { background: linear-gradient(135deg, #16a34a, #22c55e); }
    .sub-banner.active .sb-icon { background: linear-gradient(135deg, #2563eb, #7c3aed); }
    .sub-banner.expired .sb-icon { background: linear-gradient(135deg, #dc2626, #991b1b); }
    .sub-banner .sb-body { flex: 1; min-width: 220px; }
    .sub-banner .sb-title {
      font-size: 1rem; font-weight: 800; color: #0f172a;
      margin: 0 0 3px; letter-spacing: -0.01em;
    }
    .sub-banner .sb-sub {
      font-size: 0.85rem; color: #475569; margin: 0; line-height: 1.5;
    }
    .sub-banner .sb-sub strong { color: #0f172a; font-weight: 700; }
    .sub-banner .sb-cta { flex-shrink: 0; }

    /* ===== DASHBOARD STATS ===== */
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .dash-stat {
      background: #fff;
      border: 1px solid rgba(15,23,42,0.06);
      border-radius: 16px;
      padding: 1rem 1.15rem;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
    }
    .dash-stat:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(15,23,42,0.05);
    }
    .dash-stat .ds-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .dash-stat .ds-icon.green { background: rgba(22,163,74,0.1); color: #16a34a; }
    .dash-stat .ds-icon.blue { background: rgba(37,99,235,0.1); color: #2563eb; }
    .dash-stat .ds-icon.purple { background: rgba(124,58,237,0.1); color: #7c3aed; }
    .dash-stat .ds-icon.amber { background: rgba(217,119,6,0.12); color: #d97706; }
    .dash-stat .ds-icon.red { background: rgba(220,38,38,0.1); color: #dc2626; }
    .dash-stat .ds-info { flex: 1; min-width: 0; }
    .dash-stat .ds-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .dash-stat .ds-label {
      font-size: 0.72rem;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 2px;
    }

    /* ===== INFO ROW ===== */
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(15,23,42,0.06);
      font-size: 0.88rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .ir-l {
      color: #475569;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .info-row .ir-l i {
      color: #2563eb;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .info-row .ir-v {
      font-weight: 700;
      color: #0f172a;
      text-align: right;
      word-break: break-word;
      max-width: 60%;
    }
    .info-row .ir-v.good { color: #16a34a; }
    .info-row .ir-v.warn { color: #d97706; }
    .info-row .ir-v.bad { color: #dc2626; }

    /* ===== ACTIVITY ===== */
    .activity-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(15,23,42,0.05);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-item .ai-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2563eb;
      margin-top: 6px;
      flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .activity-item .ai-body { flex: 1; min-width: 0; }
    .activity-item .ai-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.4;
    }
    .activity-item .ai-time {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* ===== SUPPORT CTA ===== */
    .support-cta {
      background:
        radial-gradient(ellipse 70% 60% at 100% 0%, rgba(37,99,235,0.08), transparent 55%),
        radial-gradient(ellipse 60% 50% at 0% 100%, rgba(124,58,237,0.08), transparent 55%),
        #fff;
      border: 1px solid rgba(37,99,235,0.14);
    }

    /* ===== SPINNER (inline, for buttons) ===== */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: maintSpin 0.75s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    /* ===== PROGRESS BAR ===== */
    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: #e8edf3;
      overflow: hidden;
      margin: 0.5rem 0 0.35rem;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-fill.green { background: linear-gradient(90deg, #16a34a, #22c55e); }
    .progress-fill.blue { background: linear-gradient(90deg, #2563eb, #7c3aed); }
    .progress-fill.amber { background: linear-gradient(90deg, #f59e0b, #d97706); }
    .progress-fill.red { background: linear-gradient(90deg, #dc2626, #991b1b); }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* ===== TOAST ===== */
    #toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      width: 90%;
      max-width: 420px;
    }
    .toast {
      pointer-events: auto;
      background: #1c1c1e;
      color: #fff;
      padding: 12px 22px;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideUp 0.3s ease forwards;
      width: 100%;
      font-family: inherit;
    }
    .toast.success { background: #28A745; }
    .toast.error { background: #dc3545; }
    .toast.warning { background: #ffc107; color: #1c1c1e; }
    .toast.info { background: #2563eb; }
    .toast.hide { animation: slideDown 0.3s ease forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(30px); } }

    /* ===== FADE-UP ===== */
    .fade-up {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) {
      .fade-up { opacity: 1; transform: none; transition: none; }
    }

    /* ===== BACKUP LIST ===== */
    .backup-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid rgba(15,23,42,0.05);
      border-radius: 12px;
      margin-bottom: 8px;
      transition: 0.2s;
    }
    .backup-item:hover {
      background: #fff;
      border-color: rgba(37,99,235,0.2);
    }
    .backup-item .bi-icon {
      width: 38px; height: 38px; border-radius: 11px;
      background: rgba(37,99,235,0.1); color: #2563eb;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0;
    }
    .backup-item .bi-info { flex: 1; min-width: 0; }
    .backup-item .bi-title {
      font-size: 0.88rem; font-weight: 700; color: #0f172a;
      line-height: 1.3;
    }
    .backup-item .bi-meta {
      font-size: 0.72rem; color: #94a3b8; margin-top: 2px;
    }
    .backup-item .bi-action {
      padding: 6px 12px; border-radius: 8px;
      background: rgba(37,99,235,0.08); color: #2563eb;
      border: none; font-family: inherit; font-weight: 600;
      font-size: 0.72rem; cursor: pointer; transition: 0.15s;
      white-space: nowrap;
    }
    .backup-item .bi-action:hover { background: rgba(37,99,235,0.15); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .maint-hero { padding: 1.5rem 1.15rem; border-radius: 18px; }

  const FREE_TRIAL_DAYS = 90;           // 3 months
  const SUBSCRIPTION_PRICE_USD = 9;

  // usdRate cache to save a Firestore read on every page load
  const USD_RATE_CACHE_KEY = 'ccbd_usd_rate_v1';

  // ═══════════════════════════════════════════════════════════
  // TOAST
  // ═══════════════════════════════════════════════════════════
  window.showToast = (message, type = 'success') => {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    const icons = {
      success: 'fa-check-circle',
      error: 'fa-exclamation-circle',
      warning: 'fa-exclamation-triangle',
      info: 'fa-info-circle'
    };
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('hide');
      setTimeout(() => toast.remove(), 400);
    }, 4500);
  };

  // ═══════════════════════════════════════════════════════════
  // FADE-UP OBSERVER
  // ═══════════════════════════════════════════════════════════
  const fadeObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        fadeObserver.unobserve(e.target);
      }
    });
  }, { threshold: 0.06, rootMargin: '0px 0px -20px 0px' });

  function observeFadeUps() {
    document.querySelectorAll('.fade-up:not(.visible)').forEach(el => fadeObserver.observe(el));
  }

  // ═══════════════════════════════════════════════════════════
  // HELPERS
  // ═══════════════════════════════════════════════════════════
  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatDateTime(ts) {
    if (!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString('en-US', {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function formatDate(ts) {
    if (!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function daysBetween(a, b) {
    return Math.round((b - a) / 86400000);
  }

  // ═══════════════════════════════════════════════════════════

  // ═══════════════════════════════════════════════════════════
  // LOAD USD RATE — cached, non-blocking
  // ═══════════════════════════════════════════════════════════
  async function loadUsdRate() {
    // Try cache first (instant)
    try {
      const raw = localStorage.getItem(USD_RATE_CACHE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed?.rate > 0 && (Date.now() - parsed.ts) < USD_RATE_CACHE_TTL) {
          usdRate = Number(parsed.rate);
          return usdRate; // fast path
        }
      }
    } catch (_) {}

    // Cache miss → fetch from Firestore
    try {
      const snap = await getDoc(doc(db, 'settings', 'payment'));
      if (snap.exists() && Number(snap.data().usdRate) > 0) {
        usdRate = Number(snap.data().usdRate);
        try {
          localStorage.setItem(USD_RATE_CACHE_KEY, JSON.stringify({ rate: usdRate, ts: Date.now() }));
        } catch (_) {}
      }
    } catch (_) {}
    return usdRate;
  }

  // ═══════════════════════════════════════════════════════════
  // COMPUTE MAINTENANCE CONTEXT
  // ═══════════════════════════════════════════════════════════
  function computeMaintenanceContext(order) {
    if (!order) return null;

    const deliveredTs = order.maintenanceStartedAt
      || order.completedAt
      || order.activatedAt
      || order.updatedAt
      || order.createdAt;
    const deliveredAt = deliveredTs?.toDate ? deliveredTs.toDate() : new Date(deliveredTs || Date.now());

    const m = order.maintenance || {};
    if (m.status) {
      const trialEndsTs = m.trialEndsAt || null;
      const trialEndsAt = trialEndsTs?.toDate ? trialEndsTs.toDate() : (trialEndsTs ? new Date(trialEndsTs) : null);
      const now = new Date();
      const daysLeft = trialEndsAt ? Math.max(0, daysBetween(now, trialEndsAt)) : 0;
      const nextBillingTs = m.nextBillingAt || null;
      const nextBillingAt = nextBillingTs?.toDate ? nextBillingTs.toDate() : (nextBillingTs ? new Date(nextBillingTs) : null);

      return {
        status: m.status,
        deliveredAt,
        trialEndsAt,
        daysLeft,
        nextBillingAt,
        priceUSD: Number(m.price) || SUBSCRIPTION_PRICE_USD,
        priceBDT: Number(m.priceBDT) || Math.round(SUBSCRIPTION_PRICE_USD * usdRate),
        source: 'explicit'
      };
    }

    const trialEndsAt = new Date(deliveredAt.getTime() + FREE_TRIAL_DAYS * 86400000);
    const now = new Date();
    const daysLeft = daysBetween(now, trialEndsAt);

    if (daysLeft > 0) {
      return {
        status: 'trial',
        deliveredAt,
        trialEndsAt,
        daysLeft,
        nextBillingAt: trialEndsAt,
        priceUSD: SUBSCRIPTION_PRICE_USD,
        priceBDT: Math.round(SUBSCRIPTION_PRICE_USD * usdRate),
        source: 'auto'
      };
    }

    return {
      status: 'expired',
      deliveredAt,
      trialEndsAt,
      daysLeft: 0,
      nextBillingAt: null,
      priceUSD: SUBSCRIPTION_PRICE_USD,
      priceBDT: Math.round(SUBSCRIPTION_PRICE_USD * usdRate),
      source: 'auto'
    };
  }

        <div class="sub-banner trial fade-up" style="flex-direction:column;align-items:stretch;">

            <div class="sb-icon"><i class="fas fa-gift"></i></div>
            <div class="sb-body">
              <h3 class="sb-title">🎉 Free Trial Active · ${ctx.daysLeft} days remaining</h3>
              <p class="sb-sub">
                Enjoy full maintenance free until <strong>${formatDate(ctx.trialEndsAt)}</strong>.
                After that, continue for <strong>$${ctx.priceUSD}/month</strong> (≈ ৳${priceBDT}).
              </p>
            </div>
            <div class="sb-cta">
              <a href="messages.html" class="btn-outline">
                <i class="fas fa-comments"></i> Ask About Plan
              </a>
            </div>
          </div>
          <div style="margin-top:1rem;">
            <div class="progress-track"><div class="progress-fill green" style="width:${percentUsed}%;"></div></div>
            <div class="progress-meta">
              <span>Trial started ${formatDate(ctx.deliveredAt)}</span>
              <span>${ctx.daysLeft} days left</span>
            </div>
          </div>
        </div>
      `;
    }

    if (ctx.status === 'active') {
      return `
        <div class="sub-banner active fade-up">
          <div class="sb-icon"><i class="fas fa-check-circle"></i></div>
          <div class="sb-body">
            <h3 class="sb-title">Subscription Active</h3>
            <p class="sb-sub">
              Billed <strong>$${ctx.priceUSD}/month</strong> (≈ ৳${priceBDT}).
              ${ctx.nextBillingAt ? `Next renewal: <strong>${formatDate(ctx.nextBillingAt)}</strong>.` : ''}
            </p>
          </div>
          <div class="sb-cta">
            <a href="#" class="btn-outline" onclick="event.preventDefault();document.querySelector('[data-tab=&quot;billing&quot;]')?.click();">
              <i class="fas fa-file-invoice-dollar"></i> Manage Billing

    if (ctx.status === 'expired') {

          <div class="sb-icon"><i class="fas fa-exclamation-triangle"></i></div>
          <div class="sb-body">
            <h3 class="sb-title">Subscription Expired</h3>
            <p class="sb-sub">
              Your free trial ended on <strong>${formatDate(ctx.trialEndsAt)}</strong>.
              Renew for <strong>$${ctx.priceUSD}/month</strong> (≈ ৳${priceBDT}) to keep hosting, backups, and security running.
            </p>
          </div>
          <div class="sb-cta">
            <button type="button" class="btn-primary" onclick="window.renewSubscription()">
              <i class="fas fa-sync-alt"></i> Renew Now
            </button>
          </div>
        </div>
      `;
    }

    return '';
  }

  function renderSubscriptionBannerScripts() {
    window.renewSubscription = function() {
      if (!qualifiedOrder || !maintenanceContext) return;
      const rate = usdRate > 0 ? usdRate : 125;
      const dueBDT = Math.round(maintenanceContext.priceUSD * rate);
      const dueUSD = maintenanceContext.priceUSD;

      try {
        if (typeof openPaymentModal === 'function') {
          openPaymentModal({
            type: 'maintenance-renewal',
            isMaintenanceRenewal: true,
            orderId: qualifiedOrder.id,
            planName: 'Website Maintenance',
            total: dueUSD,
            totalUSD: dueUSD,
            totalBDT: dueBDT,
            amountUSD: dueUSD,
            amountBDT: dueBDT,
            user: currentUser,
            settings: { usdRate: rate },
            _renewalPayload: {
              orderId: qualifiedOrder.id,
              priceUSD: dueUSD,
              priceBDT: dueBDT,
              usdRate: rate
            },
            onSuccess: () => {
              showToast('✅ Subscription renewal initiated. Our team will verify shortly.', 'success');
            }
          });
        } else {
          showToast('Payment system loading. Please try again.', 'warning');
        }
      } catch (err) {
        console.error(err);
        showToast('⚠️ ' + (err.message || 'Unable to open payment'), 'error');
      }
    };
  }

  // ═══════════════════════════════════════════════════════════
  // BACKUP LIST
  // ═══════════════════════════════════════════════════════════
  function renderBackupList() {
    const wrap = document.getElementById('backupList');
    if (!wrap) return;

    const now = new Date();
    const items = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(now.getTime() - i * 86400000);
      d.setHours(2, 0, 0, 0);
      items.push({
        date: d,
        size: (120 + Math.random() * 40).toFixed(1),
        type: i === 0 ? 'Manual' : 'Auto'
      });
    }

    wrap.innerHTML = items.map((it, idx) => `
      <div class="backup-item">
        <div class="bi-icon"><i class="fas fa-archive"></i></div>
        <div class="bi-info">
          <div class="bi-title">${idx === 0 ? 'Latest backup' : 'Backup #' + (idx + 1)} · ${it.size} MB</div>
          <div class="bi-meta">${formatDateTime(it.date)} · ${it.type}</div>
        </div>
        <button type="button" class="bi-action" onclick="window.downloadBackupItem(${idx})">
          <i class="fas fa-download"></i> Download
        </button>
      </div>
    `).join('');

    window.downloadBackupItem = function(idx) {
      showToast('📦 Backup download link sent to your email', 'success');
    };
  }

      showToast('⏳ Backup started. You\'ll be notified when it\'s done.', 'info');

  // ═══════════════════════════════════════════════════════════
  // ⚡ FAST BOOT: Parallel data fetch + cached usdRate
  // ═══════════════════════════════════════════════════════════
  onAuthStateChanged(auth, async (user) => {
    currentUser = user;

    // ── No user → show empty state (fast path) ──
    if (!user) {
      updateNavbarAuth(null, null);
      loadUsdRate();
      renderNoOrder();
      return;
    }

    // ── Show navbar instantly using cached user info ──
    const cached = getCachedUser?.();
    if (cached && cached.uid === user.uid) {
      updateNavbarAuth(user, cached.displayName, cached.role);
    } else {
      updateNavbarAuth(user, user.displayName || user.email?.split('@')[0] || null, 'user');
    }

    // ── ⚡ PARALLEL: fetch orders + user doc + usdRate all at once ──
    const [ordersRes, userRes, rateRes] = await Promise.allSettled([
      getDocs(query(collection(db, 'orders'), where('userId', '==', user.uid))),
      getDoc(doc(db, 'users', user.uid)),
      loadUsdRate()
    ]);

    // ── User doc → update navbar ──
    if (userRes.status === 'fulfilled' && userRes.value.exists()) {
      currentUserData = userRes.value.data();
      updateNavbarAuth(
        user,
        currentUserData.displayName || user.email?.split('@')[0] || null,
        currentUserData.role || 'user'
      );
    }

    // ── usdRate ──
    if (rateRes.status === 'fulfilled' && Number(rateRes.value) > 0) {
      usdRate = Number(rateRes.value);
    }

    // ── Orders ──
    if (ordersRes.status !== 'fulfilled') {
      console.warn('[mainta] orders fetch failed:', ordersRes.reason);
      renderNoOrder();
      return;
    }

    allUserOrders = [];
    ordersRes.value.forEach(d => allUserOrders.push({ id: d.id, ...d.data() }));
    allUserOrders.sort((a, b) => {
      const ta = a.createdAt?.toDate?.()?.getTime() || 0;
      const tb = b.createdAt?.toDate?.()?.getTime() || 0;
      return tb - ta;
    });

    const completed = allUserOrders.filter(o => {
      const s = String(o.status || '').toLowerCase();
      return s === 'completed' || s === 'active';
    });

    if (completed.length === 0) {
      qualifiedOrder = null;
      maintenanceContext = null;
      renderNoOrder();
      return;
    }

    qualifiedOrder = completed[0];
    maintenanceContext = computeMaintenanceContext(qualifiedOrder);
    renderDashboard(qualifiedOrder);

    if (unsubOrders) { try { unsubOrders(); } catch(_) {} unsubOrders = null; }
    unsubOrders = onSnapshot(doc(db, 'orders', qualifiedOrder.id), (s) => {
      if (!s.exists()) return;
      qualifiedOrder = { id: s.id, ...s.data() };
      maintenanceContext = computeMaintenanceContext(qualifiedOrder);
      const savedTab = currentTab;
      renderDashboard(qualifiedOrder);
      setTimeout(() => {
        const tabEl = document.querySelector(`.maint-tab[data-tab="${savedTab}"]`);
        if (tabEl) tabEl.click();
      }, 10);
    });
  });

  // ═══════════════════════════════════════════════════════════
  // CLEANUP
  // ═══════════════════════════════════════════════════════════
  window.addEventListener('beforeunload', () => {
    if (unsubOrders) { try { unsubOrders(); } catch (_) {} }
  });

  console.log('⚡ mainta.html loaded — centered loading + parallel fetch + cached usdRate.');
</script>
