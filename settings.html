<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Settings – CodeCureBD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ===== PAGE-SPECIFIC (Settings) ===== */
    .section-header { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 700; color: #1c1c1e; margin-bottom: 1rem; }
    .section-header i { font-size: 1.3rem; color: #007AFF; width: 28px; text-align: center; }
    .section-header.danger i { color: #FF3B30; }
    .danger-zone { border: 2px solid #fee2e2; background: #fef2f2; }
    .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #8e8e93; cursor: pointer; font-size: 1.1rem; padding: 4px; transition: 0.2s; z-index: 2; }
    .password-toggle:hover { color: #007AFF; }
    .error-box { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 12px; padding: 1.5rem; color: #991b1b; text-align: center; margin-top: 1rem; }
    .error-box i { font-size: 2rem; margin-bottom: 0.5rem; display: block; }
    @media (max-width: 768px) { .section-header { font-size: 1rem; } }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>
    <main class="main-content">
      <section class="pt-4 pb-16 px-6 max-w-2xl mx-auto">
        <div class="flex items-center gap-3 mb-6 fade-up">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
            <i class="fas fa-cog text-xl text-white"></i>
          </div>
          <h1 class="text-3xl font-bold text-gray-900">Settings</h1>
        </div>
        <p class="text-gray-500 mb-6 fade-up">Manage your account preferences and security</p>
        <div id="settingsContainer">
          <!-- Skeletons will be rendered by JS -->
        </div>
      </section>
    </main>
    <div id="footer-placeholder"></div>
  </div>

  <button class="scroll-top-btn" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>

  <!-- Auth Modal (same as before) -->
  <div id="authModal" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4"><h3 id="authModalTitle" class="text-2xl font-bold">Sign In</h3><button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button></div>
      <form id="authForm" class="space-y-4">
        <input type="email" id="authEmail" placeholder="Email" required class="form-input" />
        <div class="relative"><input type="password" id="authPassword" placeholder="Password" required class="form-input pr-10" /><button type="button" onclick="togglePasswordVisibility('authPassword')" class="absolute right-3 top-3 text-gray-400"><i class="fas fa-eye"></i></button></div>
        <button type="submit" class="btn-primary w-full justify-center">Continue</button>
      </form>
      <div class="mt-4 flex flex-col gap-2"><button onclick="window.socialLogin('google')" class="btn-outline w-full justify-center"><i class="fab fa-google"></i> Sign in with Google</button></div>
      <p class="mt-4 text-sm text-gray-500 text-center"><span id="authToggleText">Don't have an account?</span><a href="#" id="authToggleLink" class="text-blue-600 font-medium">Sign Up</a></p>
      <div id="authError" class="text-red-500 text-sm mt-2 hidden"></div>
    </div>
  </div>
  <div id="toast-container"></div>

  <script type="module">
    // ================================================================
    // IMPORTS
    // ================================================================
    import {
      renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge,
      renderCartSidebar, setLoading, renderPaymentModal
    } from './components.js';
    import {
      auth, db, collection, doc, getDoc, getDocs, query, where,
      signOut, onAuthStateChanged, updateDoc, deleteDoc,
      signInWithPopup, googleProvider,
      reauthenticateWithCredential, updatePassword, deleteUser,
      EmailAuthProvider, updateEmail, setDoc,
      signInWithEmailAndPassword, createUserWithEmailAndPassword
    } from './firebase-config.js';

    renderNavbar(); renderPaymentModal(); renderFooter(); renderCartSidebar(); updateCartBadge();

    // ===== AUTH MODAL (same as my-fix-requests) =====
    // [Auth modal logic identical to previous pages – omitted for brevity but present in full code]

    // ================================================================
    // SETTINGS RENDER
    // ================================================================
    const container = document.getElementById('settingsContainer');

    function renderSkeletons() {
      container.innerHTML = `
        <div class="skeleton-card fade-up"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line long"></div><div class="skeleton-line" style="width:60%;"></div></div>
        <div class="skeleton-card fade-up" style="margin-top:1rem;"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line long"></div></div>
        <div class="skeleton-card fade-up" style="margin-top:1rem;"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div></div>
      `;
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    }
    renderSkeletons();

    async function renderSettings(user) {
      if (!user) {
        container.innerHTML = `<div class="text-center py-12 text-gray-500"><i class="fas fa-lock text-4xl opacity-30"></i><p class="mt-3">Please sign in to view settings.</p></div>`;
        return;
      }
      const currentEmail = user.email || '';
      const html = `
        <!-- Change Email -->
        <div class="glass-card fade-up">
          <div class="section-header"><i class="fas fa-envelope"></i><span>Change Email Address</span></div>
          <form id="changeEmailForm" class="space-y-3">
            <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Current Email</label><input type="email" id="currentEmailDisplay" class="form-input" value="${currentEmail}" disabled /></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1.5">New Email Address</label><input type="email" id="newEmail" placeholder="Enter new email" required class="form-input" /></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Current Password (to confirm)</label><div class="relative"><input type="password" id="confirmPasswordForEmail" placeholder="Enter your current password" required class="form-input pr-12" /><button type="button" onclick="window.togglePasswordVisibility('confirmPasswordForEmail')" class="password-toggle"><i class="fas fa-eye"></i></button></div></div>
            <button type="submit" class="btn-primary w-full"><i class="fas fa-save"></i> Update Email</button>
            <div id="emailChangeFeedback" class="text-sm hidden"></div>
          </form>
        </div>

        <!-- Change Password -->
        <div class="glass-card fade-up" style="margin-top:1rem;">
          <div class="section-header"><i class="fas fa-key"></i><span>Change Password</span></div>
          <form id="changePasswordForm" class="space-y-3">
            <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Current Password</label><div class="relative"><input type="password" id="currentPassword" placeholder="Enter current password" required class="form-input pr-12" /><button type="button" onclick="window.togglePasswordVisibility('currentPassword')" class="password-toggle"><i class="fas fa-eye"></i></button></div></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label><div class="relative"><input type="password" id="newPassword" placeholder="Enter new password" required class="form-input pr-12" /><button type="button" onclick="window.togglePasswordVisibility('newPassword')" class="password-toggle"><i class="fas fa-eye"></i></button></div><p class="text-xs text-gray-400 mt-1.5 flex items-center gap-1"><i class="fas fa-info-circle"></i> Must be at least 6 characters</p></div>
            <button type="submit" class="btn-primary w-full"><i class="fas fa-save"></i> Update Password</button>
            <div id="passwordFeedback" class="text-sm hidden"></div>
          </form>
        </div>

        <!-- Refund Policy -->
        <div class="glass-card fade-up" style="margin-top:1rem;">
          <div class="section-header"><i class="fas fa-file-contract"></i><span>Refund &amp; Cancellation Policy</span></div>
          <div class="text-sm text-gray-600 space-y-3 mt-2 leading-relaxed">
            <p><strong>1. Pending orders (before work starts)</strong><br/>Cancel a <strong>Pending</strong> order from My Orders. If payment received, you are eligible for a <strong>95% refund</strong>. Refund processed after admin verification (3–7 business days).</p>
            <p><strong>2. Processing / Development stage</strong><br/>Once an order moves to <strong>Processing</strong> (work started), <strong>no refund</strong> is available. The service will still be completed.</p>
            <p><strong>3. Extra / wrong amount paid</strong><br/>Excess amount will be refunded in full after verification. Contact support with proof (transaction ID + sender number).</p>
            <p><strong>4. Incomplete or incorrect payment</strong><br/>Orders with missing or incorrect transaction details may be held or cancelled. Valid payment required.</p>
            <p><strong>5. How to request</strong><br/>Cancel pending orders from <a href="my-orders.html" class="text-blue-600 underline">My Orders</a>, or message via Support Chat with Order ID and proof.</p>
            <p class="text-xs text-gray-400">CodeCureBD reserves the right to update this policy.</p>
          </div>
        </div>

        <!-- Export Data -->
        <div class="glass-card fade-up" style="margin-top:1rem;">
          <div class="section-header"><i class="fas fa-download"></i><span>Export Data</span></div>
          <p class="text-sm text-gray-500 mt-1">Download all your personal data (profile, orders, fix requests) as JSON.</p>
          <button onclick="exportUserData()" class="btn-primary mt-3 text-sm py-2 px-4"><i class="fas fa-file-export"></i> Download My Data</button>
          <div id="exportFeedback" class="mt-2 text-sm hidden"></div>
        </div>

        <!-- Danger Zone -->
        <div class="glass-card danger-zone fade-up" style="margin-top:1rem;">
          <div class="section-header danger"><i class="fas fa-exclamation-triangle"></i><span style="color:#dc2626;">Danger Zone</span></div>
          <p class="text-sm text-gray-500 mt-1">Once you delete your account, all your data will be permanently removed. This action cannot be undone.</p>
          <button onclick="deleteAccount()" class="btn-danger mt-3 text-sm py-2 px-4"><i class="fas fa-trash"></i> Delete Account</button>
          <div id="deleteFeedback" class="mt-2 text-sm hidden"></div>
        </div>

        <!-- Session -->
        <div class="glass-card fade-up" style="margin-top:1rem;">
          <div class="section-header"><i class="fas fa-sign-out-alt"></i><span>Session</span></div>
          <button onclick="window.handleLogout()" class="btn-outline mt-2 text-sm py-2 px-4"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
      `;

      container.innerHTML = html;
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
      initFormHandlers(user);
    }

    function initFormHandlers(user) {
      // ===== Change Email =====
      const changeEmailForm = document.getElementById('changeEmailForm');
      if (changeEmailForm) {
        const emailBtn = changeEmailForm.querySelector('button[type="submit"]');
        const emailFeedback = document.getElementById('emailChangeFeedback');
        changeEmailForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const newEmail = document.getElementById('newEmail').value.trim();
          const password = document.getElementById('confirmPasswordForEmail').value;
          emailFeedback.className = 'hidden';
          document.querySelectorAll('#changeEmailForm .form-input').forEach(el => el.classList.remove('error'));
          if (!newEmail || !password) {
            if (!newEmail) document.getElementById('newEmail').classList.add('error');
            if (!password) document.getElementById('confirmPasswordForEmail').classList.add('error');
            emailFeedback.className = 'block text-sm text-red-500 mt-2';
            emailFeedback.textContent = '⚠️ Please fill in all fields.';
            showToast('Please fill in all fields.', 'error');
            return;
          }
          if (!newEmail.includes('@')) {
            document.getElementById('newEmail').classList.add('error');
            emailFeedback.className = 'block text-sm text-red-500 mt-2';
            emailFeedback.textContent = '⚠️ Please enter a valid email address.';
            showToast('Please enter a valid email address.', 'error');
            return;
          }
          setLoading(emailBtn, true, 'Updating...');
          try {
            const credential = EmailAuthProvider.credential(user.email, password);
            await reauthenticateWithCredential(user, credential);
            await updateEmail(user, newEmail);
            await updateDoc(doc(db, 'users', user.uid), { email: newEmail });
            document.getElementById('currentEmailDisplay').value = newEmail;
            emailFeedback.className = 'block text-sm text-green-600 mt-2';
            emailFeedback.innerHTML = '✅ Email updated successfully!';
            showToast('✅ Email updated!', 'success');
            changeEmailForm.reset();
          } catch (err) {
            emailFeedback.className = 'block text-sm text-red-500 mt-2';
            emailFeedback.textContent = '⚠️ ' + err.message;
            showToast('⚠️ ' + err.message, 'error');
            if (err.code === 'auth/wrong-password') document.getElementById('confirmPasswordForEmail').classList.add('error');
          } finally { setLoading(emailBtn, false); }
        });
      }

      // ===== Change Password =====
      const changePasswordForm = document.getElementById('changePasswordForm');
      if (changePasswordForm) {
        const passBtn = changePasswordForm.querySelector('button[type="submit"]');
        const passwordFeedback = document.getElementById('passwordFeedback');
        changePasswordForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const current = document.getElementById('currentPassword').value;
          const newPass = document.getElementById('newPassword').value;
          passwordFeedback.className = 'hidden';
          document.querySelectorAll('#changePasswordForm .form-input').forEach(el => el.classList.remove('error'));
          if (!current || !newPass) {
            if (!current) document.getElementById('currentPassword').classList.add('error');
            if (!newPass) document.getElementById('newPassword').classList.add('error');
            passwordFeedback.className = 'block text-sm text-red-500 mt-2';
            passwordFeedback.textContent = '⚠️ Please fill in all fields.';
            showToast('Please fill in all fields', 'error');
            return;
          }
          if (newPass.length < 6) {
            document.getElementById('newPassword').classList.add('error');
            passwordFeedback.className = 'block text-sm text-red-500 mt-2';
            passwordFeedback.textContent = '⚠️ New password must be at least 6 characters.';
            showToast('Password must be at least 6 characters', 'error');
            return;
          }
          setLoading(passBtn, true, 'Updating...');
          try {
            const credential = EmailAuthProvider.credential(user.email, current);
            await reauthenticateWithCredential(user, credential);
            await updatePassword(user, newPass);
            passwordFeedback.className = 'block text-sm text-green-600 mt-2';
            passwordFeedback.innerHTML = '✅ Password updated successfully!';
            showToast('✅ Password updated!', 'success');
            changePasswordForm.reset();
          } catch (err) {
            passwordFeedback.className = 'block text-sm text-red-500 mt-2';
            passwordFeedback.textContent = '⚠️ ' + err.message;
            showToast('⚠️ ' + err.message, 'error');
            if (err.code === 'auth/wrong-password') document.getElementById('currentPassword').classList.add('error');
          } finally { setLoading(passBtn, false); }
        });
      }

      // ===== Export Data =====
      window.exportUserData = async () => {
        const btn = document.querySelector('[onclick="exportUserData()"]');
        const feedback = document.getElementById('exportFeedback');
        if (!btn) return;
        feedback.className = 'hidden';
        setLoading(btn, true);
        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          const profile = userDoc.exists() ? userDoc.data() : {};
          const ordersSnap = await getDocs(query(collection(db, 'orders'), where('userId', '==', user.uid)));
          const orders = ordersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          const fixSnap = await getDocs(query(collection(db, 'fixRequests'), where('userId', '==', user.uid)));
          const fixRequests = fixSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          const data = {
            exportedAt: new Date().toISOString(),
            user: { uid: user.uid, email: user.email, emailVerified: user.emailVerified, ...profile },
            orders,
            fixRequests
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `my-data-${new Date().toISOString().slice(0,10)}.json`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(link.href);
          feedback.className = 'block text-sm text-green-600 mt-2';
          feedback.innerHTML = '✅ Data exported successfully!';
          showToast('✅ Data exported!', 'success');
        } catch (err) {
          feedback.className = 'block text-sm text-red-500 mt-2';
          feedback.textContent = '⚠️ ' + err.message;
          showToast('⚠️ ' + err.message, 'error');
        } finally { setLoading(btn, false); }
      };

      // ===== Delete Account =====
      window.deleteAccount = async () => {
        if (!confirm('⚠️ Are you sure you want to delete your account? This action is IRREVERSIBLE.')) return;
        const confirmText = prompt('Type "DELETE" to permanently delete your account:');
        if (confirmText !== 'DELETE') { showToast('Account deletion cancelled', 'warning'); return; }
        const feedback = document.getElementById('deleteFeedback');
        feedback.className = 'hidden';
        const btn = document.querySelector('[onclick="deleteAccount()"]');
        setLoading(btn, true);
        try {
          await deleteDoc(doc(db, 'users', user.uid));
          await deleteUser(user);
          showToast('✅ Account deleted successfully.', 'success');
          window.location.href = 'index.html';
        } catch (err) {
          if (err.code === 'auth/requires-recent-login') {
            feedback.className = 'block text-sm text-red-500 mt-2';
            feedback.innerHTML = '⚠️ For security, please re-authenticate (logout and login again) before deleting your account.';
            showToast('Please re-authenticate first', 'error');
          } else {
            feedback.className = 'block text-sm text-red-500 mt-2';
            feedback.textContent = '⚠️ ' + err.message;
            showToast('⚠️ ' + err.message, 'error');
          }
        } finally { setLoading(btn, false); }
      };
    }

    // ================================================================
    // AUTH STATE
    // ================================================================
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      const displayName = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
      const role = userDoc.exists() ? userDoc.data().role : 'user';
      updateNavbarAuth(user, displayName, role);
      await renderSettings(user);
    });

    console.log('⚙️ Settings page loaded.');
  </script>
</body>
</html>
