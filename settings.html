<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1785180242/a6xbhrnjvb33c5ic6yyr.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Settings – CodeCureBD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="tailwind.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    .glass-card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      box-shadow: 0 12px 40px rgba(0,0,0,0.06);
      transform: translateY(-3px);
    }
    .danger-zone { border: 2px solid #fee2e2; background: #fef2f2; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.1rem; font-weight: 700; color: #1c1c1e;
      margin-bottom: 1rem;
    }
    .section-header i { font-size: 1.3rem; color: #007AFF; width: 28px; text-align: center; }
    .section-header.danger i { color: #FF3B30; }
    .form-input {
      width:100%; padding:12px 16px;
      border:1.5px solid rgba(60,60,67,0.08);
      border-radius:12px; font-size:0.95rem;
      background:rgba(255,255,255,0.8);
      transition:all 0.3s; outline:none;
      font-family:inherit;
    }
    .form-input:focus {
      border-color:#007AFF;
      box-shadow:0 0 0 4px rgba(0,122,255,0.08);
      background:#fff;
    }
    .form-input.error {
      border-color:#FF3B30;
      box-shadow:0 0 0 4px rgba(255,59,48,0.08);
    }
    .password-toggle {
      position:absolute; right:14px; top:50%;
      transform:translateY(-50%);
      background:none; border:none; color:#8e8e93;
      cursor:pointer; font-size:1.1rem; padding:4px;
      transition:0.2s; z-index:2;
    }
    .password-toggle:hover { color:#007AFF; }
    .btn-primary {
      background:linear-gradient(135deg,#007AFF,#5856D6);
      color:#fff; padding:10px 22px; border-radius:60px;
      font-weight:600; font-size:0.95rem; border:none;
      cursor:pointer; transition:all 0.3s;
      display:inline-flex; align-items:center; justify-content:center;
      gap:8px; min-height:48px;
    }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,122,255,0.35); }
    .btn-primary:disabled { opacity:0.7; cursor:not-allowed; transform:none !important; }
    .btn-outline {
      background:transparent; color:#1c1c1e;
      padding:10px 22px; border-radius:60px;
      font-weight:600; font-size:0.95rem;
      border:1.5px solid rgba(60,60,67,0.08);
      cursor:pointer; transition:all 0.3s;
      display:inline-flex; align-items:center; gap:8px;
      background:rgba(255,255,255,0.5); min-height:48px;
    }
    .btn-outline:hover {
      background:rgba(0,122,255,0.04);
      border-color:#007AFF; color:#007AFF;
      transform:translateY(-2px);
    }
    .btn-danger {
      background:linear-gradient(135deg,#FF3B30,#dc2626);
      color:#fff; padding:10px 22px; border-radius:60px;
      font-weight:600; font-size:0.95rem; border:none;
      cursor:pointer; transition:all 0.3s;
      display:inline-flex; align-items:center; justify-content:center;
      gap:8px; min-height:48px;
    }
    .btn-danger:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(255,59,48,0.35); }
    .btn-danger:disabled { opacity:0.7; cursor:not-allowed; transform:none !important; }
    .skeleton-card {
      background:#f3f4f6; border-radius:16px;
      padding:1.25rem; animation:pulse 1.5s ease-in-out infinite;
    }
    .skeleton-card .skeleton-line {
      height:16px; background:#e5e7eb;
      border-radius:8px; margin-bottom:0.75rem;
    }
    .skeleton-card .skeleton-line.short { width:40%; }
    .skeleton-card .skeleton-line.medium { width:70%; }
    .skeleton-card .skeleton-line.long { width:90%; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .fade-up { opacity:0; transform:translateY(20px); transition:opacity 0.5s, transform 0.5s; }
    .fade-up.visible { opacity:1; transform:translateY(0); }
    .scroll-top-btn {
      position:fixed; bottom:30px; right:30px;
      width:50px; height:50px; border-radius:50%;
      background:linear-gradient(135deg,#007AFF,#5856D6);
      color:#fff; border:none; font-size:1.2rem;
      cursor:pointer; box-shadow:0 8px 30px rgba(0,122,255,0.35);
      z-index:999; opacity:0; transform:scale(0.8);
      transition:opacity 0.3s, transform 0.3s; pointer-events:none;
    }
    .scroll-top-btn.show { opacity:1; transform:scale(1); pointer-events:auto; }
    .scroll-top-btn:hover { transform:scale(1.05); }
    .error-box {
      background:#fef2f2; border:1px solid #fca5a5;
      border-radius:12px; padding:1.5rem; color:#991b1b;
      text-align:center; margin-top:1rem;
    }
    .error-box i { font-size:2rem; margin-bottom:0.5rem; display:block; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.55);
      backdrop-filter: blur(8px);
      z-index: 5000;
      display: none; align-items: center; justify-content: center;
      padding: 1rem;
      animation: modalFade 0.2s ease;
    }
    .modal-overlay.open { display: flex; }
    @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
    .modal-box {
      background: #fff; border-radius: 20px;
      padding: 1.75rem 1.75rem 1.5rem;
      max-width: 440px; width: 100%;
      box-shadow: 0 24px 80px rgba(0,0,0,0.25);
      animation: modalScale 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes modalScale {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-box .modal-icon {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      font-size: 1.5rem;
    }
    .modal-box h3 {
      font-size: 1.15rem; font-weight: 700; text-align: center;
      color: #0f172a; margin: 0 0 6px;
    }
    .modal-box p {
      font-size: 0.88rem; color: #64748b;
      text-align: center; margin: 0 0 1.25rem; line-height: 1.55;
    }
    .modal-box .modal-actions {
      display: flex; gap: 8px; margin-top: 1rem;
    }
    .modal-box .modal-actions button {
      flex: 1; padding: 11px 16px; border-radius: 12px;
      font-size: 0.9rem; font-weight: 700;
      font-family: inherit; cursor: pointer;
      border: none; min-height: 46px;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; transition: 0.2s;
    }
    .modal-box .modal-actions .cancel {
      background: #f1f5f9; color: #475569;
    }
    .modal-box .modal-actions .cancel:hover { background: #e2e8f0; }
    .modal-box .modal-actions .confirm {
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
    }
    .modal-box .modal-actions .confirm:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,122,255,0.3);
    }
    .modal-box .modal-actions .confirm.danger {
      background: linear-gradient(135deg, #FF3B30, #dc2626);
    }
    .modal-box .modal-actions .confirm.danger:hover:not(:disabled) {
      box-shadow: 0 6px 20px rgba(255,59,48,0.3);
    }
    .modal-box .modal-actions button:disabled {
      opacity: 0.5; cursor: not-allowed; transform: none !important;
      box-shadow: none !important;
    }
    .modal-box .modal-error {
      color: #dc2626; font-size: 0.82rem;
      text-align: center; margin-top: 10px;
      display: none;
    }
    .modal-box .modal-error.show { display: block; }
    .modal-box input.form-input {
      padding-right: 44px;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>
    <main class="main-content">
      <section class="pt-4 pb-16 px-6 max-w-2xl mx-auto">
        <div class="flex items-center gap-3 mb-6 fade-up">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
            <i class="fas fa-cog text-xl text-white"></i>
          </div>
          <h1 class="text-3xl font-bold text-gray-900">Settings</h1>
        </div>
        <p class="text-gray-500 mb-6 fade-up">Manage your account preferences and security</p>
        <div id="settingsContainer">
          <!-- Skeletons will be rendered by JS -->
        </div>
      </section>
    </main>
    <div id="footer-placeholder"></div>
  </div>

  <button class="scroll-top-btn" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>

  <!-- ===== RE-AUTH / PASSWORD MODAL (universal) ===== -->
  <div id="reauthModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-icon" id="reauthIcon" style="background:rgba(0,122,255,0.1);color:#007AFF;">
        <i class="fas fa-lock"></i>
      </div>
      <h3 id="reauthTitle">Confirm Password</h3>
      <p id="reauthDesc">Please enter your password to continue.</p>
      <div class="relative">
        <input type="password" id="reauthPasswordInput" class="form-input" placeholder="Enter your password" autocomplete="current-password" />
        <button type="button" class="password-toggle" onclick="toggleReauthPassword()" aria-label="Toggle password visibility">
          <i class="fas fa-eye" id="reauthEyeIcon"></i>
        </button>
      </div>
      <div class="modal-error" id="reauthError"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" onclick="closeReauthModal()">Cancel</button>
        <button type="button" class="confirm" id="reauthConfirmBtn" onclick="submitReauth()">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    console.log('⚙️ Settings page: Script started');

    const container = document.getElementById('settingsContainer');
    if (!container) {
      console.error('❌ Container not found!');
      document.body.innerHTML = '<div style="padding:2rem;color:red;">Error: settingsContainer not found in DOM.</div>';
      throw new Error('settingsContainer missing');
    }

    function showError(message) {
      container.innerHTML = `
        <div class="error-box">
          <i class="fas fa-exclamation-triangle"></i>
          <strong>${message}</strong>
          <br><button onclick="window.location.reload()" class="btn-primary mt-3 text-sm">Refresh</button>
        </div>
      `;
    }

    // ═══════════════════════════════════════════════════════════
    // DYNAMIC IMPORTS
    // ═══════════════════════════════════════════════════════════
    try {
      console.log('⏳ Importing modules...');
      const [
        { renderNavbar, renderFooter, updateNavbarAuth, updateCartBadge,
          renderCartSidebar, setLoading, renderPaymentModal, renderAuthModal },
        firebase
      ] = await Promise.all([
        import('./components.js'),
        import('./firebase-config.js')
      ]);
      console.log('✅ Modules imported successfully');

      const {
        auth, db, collection, doc, getDoc, getDocs, query, where,
        signOut, onAuthStateChanged, updateDoc, deleteDoc,
        signInWithPopup, googleProvider,
        reauthenticateWithCredential, updatePassword, deleteUser,
        EmailAuthProvider, updateEmail, setDoc,
        signInWithEmailAndPassword, createUserWithEmailAndPassword
      } = firebase;

      // ═══════════════════════════════════════════════════════════
      // COMMON RENDER
      // ═══════════════════════════════════════════════════════════
      renderNavbar();
      renderAuthModal();
      renderPaymentModal();
      renderFooter();
      renderCartSidebar();
      updateCartBadge();

      // ═══════════════════════════════════════════════════════════
      // TOAST
      // ═══════════════════════════════════════════════════════════
      window.showToast = (message, type = 'success') => {
        const toastContainer = document.getElementById('toast-container');
        if (!toastContainer) return;
        const toast = document.createElement('div');
        const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> ${message}`;
        toastContainer.appendChild(toast);
        setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 400); }, 4500);
      };

      // ═══════════════════════════════════════════════════════════
      // OBSERVER + SCROLL
      // ═══════════════════════════════════════════════════════════
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
      }, { threshold: 0.1 });
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
      });

      const scrollBtn = document.getElementById('scrollTopBtn');
      window.addEventListener('scroll', () => { scrollBtn.classList.toggle('show', window.scrollY > 400); });
      scrollBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

      // ═══════════════════════════════════════════════════════════
      // PASSWORD VISIBILITY TOGGLE (universal)
      // ═══════════════════════════════════════════════════════════
      window.togglePasswordVisibility = function(id) {
        const input = document.getElementById(id);
        if (!input) return;
        const btn = input.parentElement.querySelector('.password-toggle');
        const icon = btn ? btn.querySelector('i') : null;
        if (input.type === 'password') {
          input.type = 'text';
          if (icon) icon.className = 'fas fa-eye-slash';
        } else {
          input.type = 'password';
          if (icon) icon.className = 'fas fa-eye';
        }
      };

      window.toggleReauthPassword = function() {
        const input = document.getElementById('reauthPasswordInput');
        const icon = document.getElementById('reauthEyeIcon');
        if (!input) return;
        if (input.type === 'password') {
          input.type = 'text';
          if (icon) icon.className = 'fas fa-eye-slash';
        } else {
          input.type = 'password';
          if (icon) icon.className = 'fas fa-eye';
        }
      };

      // ═══════════════════════════════════════════════════════════
      // UNIVERSAL RE-AUTH MODAL
      // ═══════════════════════════════════════════════════════════
      let _reauthResolve = null;

      window.openReauthModal = function({ title, desc, confirmText, danger, icon }) {
        return new Promise((resolve) => {
          document.getElementById('reauthTitle').textContent = title || 'Confirm Password';
          document.getElementById('reauthDesc').textContent = desc || 'Please enter your password to continue.';
          const confirmBtn = document.getElementById('reauthConfirmBtn');
          confirmBtn.textContent = confirmText || 'Confirm';
          confirmBtn.className = 'confirm' + (danger ? ' danger' : '');

          const iconBox = document.getElementById('reauthIcon');
          if (danger) {
            iconBox.style.background = 'rgba(255,59,48,0.1)';
            iconBox.style.color = '#FF3B30';
            iconBox.innerHTML = `<i class="fas ${icon || 'fa-exclamation-triangle'}"></i>`;
          } else {
            iconBox.style.background = 'rgba(0,122,255,0.1)';
            iconBox.style.color = '#007AFF';
            iconBox.innerHTML = `<i class="fas ${icon || 'fa-lock'}"></i>`;
          }

          const input = document.getElementById('reauthPasswordInput');
          const eyeIcon = document.getElementById('reauthEyeIcon');
          input.value = '';
          input.type = 'password';
          if (eyeIcon) eyeIcon.className = 'fas fa-eye';
          input.classList.remove('error');
          document.getElementById('reauthError').classList.remove('show');
          document.getElementById('reauthModal').classList.add('open');
          setTimeout(() => input.focus(), 80);
          _reauthResolve = resolve;
        });
      };

      window.closeReauthModal = function() {
        document.getElementById('reauthModal').classList.remove('open');
        if (_reauthResolve) {
          _reauthResolve(null);
          _reauthResolve = null;
        }
      };

      window.submitReauth = function() {
        const input = document.getElementById('reauthPasswordInput');
        const password = (input.value || '').trim();
        const errEl = document.getElementById('reauthError');
        if (!password) {
          errEl.textContent = 'Please enter your password.';
          errEl.classList.add('show');
          input.classList.add('error');
          input.focus();
          return;
        }
        if (password.length < 6) {
          errEl.textContent = 'Password must be at least 6 characters.';
          errEl.classList.add('show');
          input.classList.add('error');
          input.focus();
          return;
        }
        errEl.classList.remove('show');
        input.classList.remove('error');
        document.getElementById('reauthModal').classList.remove('open');
        if (_reauthResolve) {
          _reauthResolve(password);
          _reauthResolve = null;
        }
      };

      // Enter key submits re-auth
      document.getElementById('reauthPasswordInput')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); window.submitReauth(); }
        if (e.key === 'Escape') { e.preventDefault(); window.closeReauthModal(); }
      });

      // Close on backdrop click
      document.getElementById('reauthModal')?.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) window.closeReauthModal();
      });

      // ═══════════════════════════════════════════════════════════
      // SKELETON
      // ═══════════════════════════════════════════════════════════
      function renderSkeletons() {
        container.innerHTML = `
          <div class="skeleton-card fade-up"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line long"></div><div class="skeleton-line" style="width:60%;"></div></div>
          <div class="skeleton-card fade-up" style="margin-top:1rem;"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line long"></div></div>
          <div class="skeleton-card fade-up" style="margin-top:1rem;"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div></div>
        `;
        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
      }

      renderSkeletons();

      // ═══════════════════════════════════════════════════════════
      // RENDER SETTINGS
      // ═══════════════════════════════════════════════════════════
      async function renderSettings(user) {
        try {
          if (!user) {
            container.innerHTML = `<div class="text-center py-12 text-gray-500"><i class="fas fa-lock text-4xl opacity-30"></i><p class="mt-3">Please sign in to view settings.</p></div>`;
            return;
          }

          const currentEmail = user.email || '';

          // Load refund policy from settings (fallback to default)
          let refundPolicyHtml = defaultRefundPolicyHtml();
          try {
            const snap = await getDoc(doc(db, 'settings', 'refundPolicy'));
            if (snap.exists() && snap.data().html) {
              refundPolicyHtml = snap.data().html;
            }
          } catch (_) { /* use default */ }

          const html = `
            <!-- Change Email -->
            <div class="glass-card fade-up">
              <div class="section-header"><i class="fas fa-envelope"></i><span>Change Email Address</span></div>
              <form id="changeEmailForm" class="space-y-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1.5">Current Email</label>
                  <input type="email" id="currentEmailDisplay" class="form-input" value="${currentEmail}" disabled />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1.5">New Email Address</label>
                  <input type="email" id="newEmail" placeholder="Enter new email" required class="form-input" autocomplete="email" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1.5">Current Password (to confirm)</label>
                  <div class="relative">
                    <input type="password" id="confirmPasswordForEmail" placeholder="Enter your current password" required class="form-input pr-12" autocomplete="current-password" />
                    <button type="button" onclick="window.togglePasswordVisibility('confirmPasswordForEmail')" class="password-toggle" aria-label="Toggle password">
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
                <button type="submit" class="btn-primary w-full"><i class="fas fa-save"></i> Update Email</button>
                <div id="emailChangeFeedback" class="text-sm hidden"></div>
              </form>
            </div>

            <!-- Change Password -->
            <div class="glass-card fade-up" style="margin-top:1rem;">
              <div class="section-header"><i class="fas fa-key"></i><span>Change Password</span></div>
              <form id="changePasswordForm" class="space-y-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1.5">Current Password</label>
                  <div class="relative">
                    <input type="password" id="currentPassword" placeholder="Enter current password" required class="form-input pr-12" autocomplete="current-password" />
                    <button type="button" onclick="window.togglePasswordVisibility('currentPassword')" class="password-toggle" aria-label="Toggle password">
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label>
                  <div class="relative">
                    <input type="password" id="newPassword" placeholder="Enter new password" required class="form-input pr-12" autocomplete="new-password" />
                    <button type="button" onclick="window.togglePasswordVisibility('newPassword')" class="password-toggle" aria-label="Toggle password">
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                  <p class="text-xs text-gray-400 mt-1.5 flex items-center gap-1"><i class="fas fa-info-circle"></i> Must be at least 6 characters</p>
                </div>
                <button type="submit" class="btn-primary w-full"><i class="fas fa-save"></i> Update Password</button>
                <div id="passwordFeedback" class="text-sm hidden"></div>
              </form>
            </div>

            <!-- Refund & Cancellation Policy -->
            <div class="glass-card fade-up" style="margin-top:1rem;">
              <div class="section-header"><i class="fas fa-file-contract"></i><span>Refund &amp; Cancellation Policy</span></div>
              <div class="text-sm text-gray-600 space-y-3 mt-2 leading-relaxed">
                ${refundPolicyHtml}
              </div>
            </div>

            <!-- Export Data -->
            <div class="glass-card fade-up" style="margin-top:1rem;">
              <div class="section-header"><i class="fas fa-download"></i><span>Export Data</span></div>
              <p class="text-sm text-gray-500 mt-1">Download all your personal data (profile, orders, fix requests) as JSON.</p>
              <button type="button" onclick="window.exportUserData()" class="btn-primary mt-3 text-sm py-2 px-4"><i class="fas fa-file-export"></i> Download My Data</button>
              <div id="exportFeedback" class="mt-2 text-sm hidden"></div>
            </div>

            <!-- Danger Zone -->
            <div class="glass-card danger-zone fade-up" style="margin-top:1rem;">
              <div class="section-header danger"><i class="fas fa-exclamation-triangle"></i><span style="color:#dc2626;">Danger Zone</span></div>
              <p class="text-sm text-gray-500 mt-1">Once you delete your account, all your data will be permanently removed. This action cannot be undone.</p>
              <button type="button" onclick="window.deleteAccount()" class="btn-danger mt-3 text-sm py-2 px-4"><i class="fas fa-trash"></i> Delete Account</button>
              <div id="deleteFeedback" class="mt-2 text-sm hidden"></div>
            </div>

            <!-- Session -->
            <div class="glass-card fade-up" style="margin-top:1rem;">
              <div class="section-header"><i class="fas fa-sign-out-alt"></i><span>Session</span></div>
              <button type="button" onclick="window.handleLogout()" class="btn-outline mt-2 text-sm py-2 px-4"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
          `;

          container.innerHTML = html;
          document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

          initFormHandlers(user);
        } catch (error) {
          console.error('❌ Error rendering settings:', error);
          showError('Error loading settings: ' + error.message);
        }
      }

      function defaultRefundPolicyHtml() {
        return `
          <p><strong>1. Pending orders (before work starts)</strong><br/>
          You may cancel a <strong>Pending</strong> order from My Orders. If payment was already received, you are eligible for a <strong>95% refund</strong>. The remaining 5% covers payment gateway / processing costs. Refund is processed after admin verification (usually within 3–7 business days to the original payment method).</p>
          <p><strong>2. Processing / Development stage</strong><br/>
          Once an order moves to <strong>Processing</strong> (work has started), <strong>no refund</strong> is available. The ordered service will still be completed and delivered as agreed.</p>
          <p><strong>3. Extra / wrong amount paid</strong><br/>
          If you sent more than the order total by mistake, the <strong>excess amount will be refunded</strong> in full after verification. Contact support with proof (transaction ID + sender number).</p>
          <p><strong>4. Incomplete or incorrect payment</strong><br/>
          Orders with missing, fake, or incorrect transaction details may be held or cancelled by admin. Valid payments are required before work begins.</p>
          <p><strong>5. How to request</strong><br/>
          Cancel pending orders from <a href="my-orders.html" class="text-blue-600 underline">My Orders</a>, or message us via Support Chat with Order ID and transaction proof for excess-payment refunds.</p>
          <p class="text-xs text-gray-400">CodeCureBD reserves the right to update this policy. Continued use of the service means you accept the current policy.</p>
        `;
      }

      // ═══════════════════════════════════════════════════════════
      // FORM HANDLERS
      // ═══════════════════════════════════════════════════════════
      function initFormHandlers(user) {

        // ===== CHANGE EMAIL =====
        const changeEmailForm = document.getElementById('changeEmailForm');
        if (changeEmailForm) {
          const emailBtn = changeEmailForm.querySelector('button[type="submit"]');
          const emailFeedback = document.getElementById('emailChangeFeedback');

          document.querySelectorAll('#changeEmailForm .form-input')
            .forEach(el => el.addEventListener('focus', () => el.classList.remove('error')));

          changeEmailForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newEmail = document.getElementById('newEmail').value.trim();
            const password = document.getElementById('confirmPasswordForEmail').value;

            emailFeedback.className = 'hidden';
            document.querySelectorAll('#changeEmailForm .form-input')
              .forEach(el => el.classList.remove('error'));

            if (!newEmail || !password) {
              if (!newEmail) document.getElementById('newEmail').classList.add('error');
              if (!password) document.getElementById('confirmPasswordForEmail').classList.add('error');
              emailFeedback.className = 'block text-sm text-red-500 mt-2';
              emailFeedback.textContent = '⚠️ Please fill in all fields.';
              return;
            }

            if (!/^\S+@\S+\.\S+$/.test(newEmail)) {
              document.getElementById('newEmail').classList.add('error');
              emailFeedback.className = 'block text-sm text-red-500 mt-2';
              emailFeedback.textContent = '⚠️ Please enter a valid email address.';
              return;
            }

            if (newEmail.toLowerCase() === (user.email || '').toLowerCase()) {
              emailFeedback.className = 'block text-sm text-amber-600 mt-2';
              emailFeedback.textContent = '⚠️ New email is the same as current email.';
              return;
            }

            setLoading(emailBtn, true, 'Updating...');
            try {
              const credential = EmailAuthProvider.credential(user.email, password);
              await reauthenticateWithCredential(user, credential);
              await updateEmail(user, newEmail);
              await updateDoc(doc(db, 'users', user.uid), { email: newEmail });

              document.getElementById('currentEmailDisplay').value = newEmail;
              emailFeedback.className = 'block text-sm text-green-600 mt-2';
              emailFeedback.innerHTML = '✅ Email updated successfully!';
              showToast('✅ Email updated!', 'success');
              changeEmailForm.reset();
            } catch (err) {
              let msg = err.message;
              if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                msg = 'Incorrect password.';
                document.getElementById('confirmPasswordForEmail').classList.add('error');
              } else if (err.code === 'auth/email-already-in-use') {
                msg = 'This email is already in use by another account.';
                document.getElementById('newEmail').classList.add('error');
              } else if (err.code === 'auth/invalid-email') {
                msg = 'Invalid email address.';
                document.getElementById('newEmail').classList.add('error');
              }
              emailFeedback.className = 'block text-sm text-red-500 mt-2';
              emailFeedback.textContent = '⚠️ ' + msg;
              showToast('⚠️ ' + msg, 'error');
            } finally {
              setLoading(emailBtn, false);
            }
          });
        }

        // ===== CHANGE PASSWORD =====
        const changePasswordForm = document.getElementById('changePasswordForm');
        if (changePasswordForm) {
          const passBtn = changePasswordForm.querySelector('button[type="submit"]');
          const passwordFeedback = document.getElementById('passwordFeedback');

          document.querySelectorAll('#changePasswordForm .form-input')
            .forEach(el => el.addEventListener('focus', () => el.classList.remove('error')));

          changePasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const current = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;

            passwordFeedback.className = 'hidden';
            document.querySelectorAll('#changePasswordForm .form-input')
              .forEach(el => el.classList.remove('error'));

            if (!current || !newPass) {
              if (!current) document.getElementById('currentPassword').classList.add('error');
              if (!newPass) document.getElementById('newPassword').classList.add('error');
              passwordFeedback.className = 'block text-sm text-red-500 mt-2';
              passwordFeedback.textContent = '⚠️ Please fill in all fields.';
              return;
            }

            if (newPass.length < 6) {
              document.getElementById('newPassword').classList.add('error');
              passwordFeedback.className = 'block text-sm text-red-500 mt-2';
              passwordFeedback.textContent = '⚠️ New password must be at least 6 characters.';
              return;
            }

            if (newPass === current) {
              passwordFeedback.className = 'block text-sm text-amber-600 mt-2';
              passwordFeedback.textContent = '⚠️ New password must be different from current password.';
              return;
            }

            setLoading(passBtn, true, 'Updating...');
            try {
              const credential = EmailAuthProvider.credential(user.email, current);
              await reauthenticateWithCredential(user, credential);
              await updatePassword(user, newPass);

              passwordFeedback.className = 'block text-sm text-green-600 mt-2';
              passwordFeedback.innerHTML = '✅ Password updated successfully!';
              showToast('✅ Password updated!', 'success');
              changePasswordForm.reset();
            } catch (err) {
              let msg = err.message;
              if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                msg = 'Incorrect current password.';
                document.getElementById('currentPassword').classList.add('error');
              }
              passwordFeedback.className = 'block text-sm text-red-500 mt-2';
              passwordFeedback.textContent = '⚠️ ' + msg;
              showToast('⚠️ ' + msg, 'error');
            } finally {
              setLoading(passBtn, false);
            }
          });
        }

        // ===== EXPORT DATA =====
        window.exportUserData = async () => {
          const btn = document.querySelector('[onclick="window.exportUserData()"]');
          const feedback = document.getElementById('exportFeedback');
          if (!btn) return;
          feedback.className = 'hidden';
          setLoading(btn, true);

          try {
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            const profile = userDoc.exists() ? userDoc.data() : {};

            let orders = [];
            try {
              const ordersSnap = await getDocs(query(collection(db, 'orders'), where('userId', '==', user.uid)));
              orders = ordersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (e) {
              console.warn('Orders export failed:', e);
            }

            let fixRequests = [];
            try {
              const fixSnap = await getDocs(query(collection(db, 'fixRequests'), where('userId', '==', user.uid)));
              fixRequests = fixSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (e) {
              console.warn('Fix requests export failed:', e);
            }

            const data = {
              exportedAt: new Date().toISOString(),
              user: {
                uid: user.uid,
                email: user.email,
                emailVerified: user.emailVerified,
                ...profile
              },
              orders,
              fixRequests,
              summary: {
                totalOrders: orders.length,
                totalFixRequests: fixRequests.length
              }
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `codecurebd-data-${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);

            feedback.className = 'block text-sm text-green-600 mt-2';
            feedback.innerHTML = `✅ Exported: ${orders.length} orders, ${fixRequests.length} fix requests.`;
            showToast('✅ Data exported!', 'success');
          } catch (err) {
            feedback.className = 'block text-sm text-red-500 mt-2';
            feedback.textContent = '⚠️ ' + err.message;
            showToast('⚠️ ' + err.message, 'error');
          } finally {
            setLoading(btn, false);
          }
        };

        // ===== DELETE ACCOUNT (with re-auth flow) =====
        window.deleteAccount = async () => {
          // Step 1: Confirm
          if (!confirm('⚠️ Are you sure you want to delete your account? This action is IRREVERSIBLE and all your data will be permanently lost.')) return;

          // Step 2: Type DELETE
          const confirmText = prompt('Type "DELETE" (all caps) to confirm account deletion:');
          if (confirmText !== 'DELETE') {
            showToast('Account deletion cancelled', 'warning');
            return;
          }

          // Step 3: Re-auth via modal
          const password = await window.openReauthModal({
            title: 'Confirm Account Deletion',
            desc: 'Enter your password to permanently delete your account. This cannot be undone.',
            confirmText: 'Delete Account',
            danger: true,
            icon: 'fa-trash-alt'
          });

          if (!password) {
            showToast('Deletion cancelled', 'warning');
            return;
          }

          const feedback = document.getElementById('deleteFeedback');
          feedback.className = 'hidden';
          const btn = document.querySelector('[onclick="window.deleteAccount()"]');
          setLoading(btn, true, 'Deleting...');

          try {
            // Re-authenticate first
            const credential = EmailAuthProvider.credential(user.email, password);
            await reauthenticateWithCredential(user, credential);

            // IMPORTANT: Delete Firestore doc FIRST, then Auth
            // (If Auth delete succeeds but Firestore fails, user doc would be orphaned)
            try {
              await deleteDoc(doc(db, 'users', user.uid));
            } catch (fsErr) {
              console.warn('Firestore user doc delete failed:', fsErr);
              // Continue anyway — Auth deletion is the primary goal
            }

            // Delete Auth user (this signs out the user)
            await deleteUser(user);

            showToast('✅ Account deleted successfully.', 'success');
            feedback.className = 'block text-sm text-green-600 mt-2';
            feedback.textContent = '✅ Account deleted. Redirecting…';

            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1200);
          } catch (err) {
            let msg = err.message;
            if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
              msg = 'Incorrect password. Please try again.';
            } else if (err.code === 'auth/requires-recent-login') {
              msg = 'Session expired. Please log out and log in again before deleting your account.';
            }
            feedback.className = 'block text-sm text-red-500 mt-2';
            feedback.textContent = '⚠️ ' + msg;
            showToast('⚠️ ' + msg, 'error');
          } finally {
            setLoading(btn, false);
          }
        };

        // ===== LOGOUT =====
        // window.handleLogout is defined in components.js
      }

      // ═══════════════════════════════════════════════════════════
      // AUTH STATE
      // ═══════════════════════════════════════════════════════════
      onAuthStateChanged(auth, async (user) => {
        try {
          console.log('🔐 Auth state changed:', user?.email);
          if (!user) {
            window.location.href = 'index.html';
            return;
          }
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          const displayName = userDoc.exists() ? userDoc.data().displayName : user.email.split('@')[0];
          const role = userDoc.exists() ? userDoc.data().role : 'user';
          updateNavbarAuth(user, displayName, role);
          await renderSettings(user);
        } catch (error) {
          console.error('🔥 Auth state error:', error);
          showError('Error loading user data: ' + error.message);
        }
      });

      console.log('⚙️ Settings page ready.');

    } catch (importError) {
      console.error('❌ Import error:', importError);
      showError('Failed to load required modules: ' + importError.message + '. Please check your internet connection and file paths.');
    }
  </script>
