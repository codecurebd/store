<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>My Wishlist – SWD Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    * { box-sizing: border-box; }
    body { background: #f2f4f7; font-family: 'Inter', sans-serif; margin: 0; padding: 0; min-height: 100vh; }
    .glass-card { background: rgba(255,255,255,0.72); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.7); border-radius: 16px; padding: 1.25rem; transition: all 0.3s; }
    .glass-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.06); }
    .product-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px 12px 0 0; }
    .btn-primary { background: linear-gradient(135deg, #007AFF, #5856D6); color: #fff; padding: 10px 22px; border-radius: 60px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,122,255,0.35); }
    .btn-outline { background: rgba(255,255,255,0.5); color: #1c1c1e; padding: 10px 22px; border-radius: 60px; font-weight: 600; border: 1.5px solid rgba(60,60,67,0.08); cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-outline:hover { border-color: #007AFF; color: #007AFF; transform: translateY(-2px); }
    .empty-state { text-align: center; padding: 3rem 1.5rem; }
    .empty-state i { font-size: 4rem; opacity: 0.3; color: #8e8e93; }
    .fade-up { opacity: 0; transform: translateY(20px); transition: opacity 0.5s, transform 0.5s; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
    .skeleton-card { background: #f3f4f6; border-radius: 16px; padding: 1.25rem; animation: pulse 1.5s infinite; }
    .skeleton-card .skeleton-img { width: 100%; height: 160px; background: #e5e7eb; border-radius: 12px; margin-bottom: 0.75rem; }
    .skeleton-card .skeleton-line { height: 16px; background: #e5e7eb; border-radius: 8px; margin-bottom: 0.75rem; }
    .skeleton-card .skeleton-line.short { width: 40%; }
    .skeleton-card .skeleton-line.medium { width: 70%; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div id="navbar-placeholder"></div>
    <main class="main-content">
      <section class="pt-28 pb-16 px-6 max-w-6xl mx-auto">
        <div class="flex items-center gap-3 mb-6 fade-up">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-red-500 to-pink-500 flex items-center justify-center shadow-lg shadow-red-500/20">
            <i class="fas fa-heart text-xl text-white"></i>
          </div>
          <h1 class="text-3xl font-bold text-gray-900">My Wishlist</h1>
        </div>
        <p class="text-gray-500 mb-6 fade-up">Products you've saved for later.</p>
        <div id="wishlistGrid" class="grid md:grid-cols-3 gap-6">
          <!-- Skeletons will be rendered by JS -->
        </div>
      </section>
    </main>
    <div id="footer-placeholder"></div>
  </div>

  <script type="module">
    import { renderNavbar, renderFooter, updateCartBadge, renderCartSidebar } from './components.js';
    import { auth, db, collection, doc, getDoc, onSnapshot, query, where, deleteDoc } from './firebase-config.js';

    renderNavbar();
    renderFooter();
    renderCartSidebar();
    updateCartBadge();

    const grid = document.getElementById('wishlistGrid');

    function renderSkeletons() {
      grid.innerHTML = `
        <div class="skeleton-card fade-up"><div class="skeleton-img"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
        <div class="skeleton-card fade-up"><div class="skeleton-img"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
        <div class="skeleton-card fade-up"><div class="skeleton-img"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
      `;
    }
    renderSkeletons();

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        grid.innerHTML = `
          <div class="empty-state col-span-full fade-up">
            <i class="fas fa-heart"></i>
            <h3 class="text-xl font-semibold text-gray-900 mt-3">Please Sign In</h3>
            <p class="text-gray-500">Sign in to view your wishlist.</p>
            <button onclick="window.openAuthModal('signin')" class="btn-primary mt-4">Sign In</button>
          </div>
        `;
        return;
      }

      const q = query(collection(db, 'wishlist'), where('userId', '==', user.uid));
      const unsub = onSnapshot(q, async (snapshot) => {
        if (snapshot.empty) {
          grid.innerHTML = `
            <div class="empty-state col-span-full fade-up">
              <i class="fas fa-heart"></i>
              <h3 class="text-xl font-semibold text-gray-900 mt-3">Your wishlist is empty</h3>
              <p class="text-gray-500">Explore our store and save your favorite products.</p>
              <a href="get-new-website.html" class="btn-primary mt-4">Browse Store</a>
            </div>
          `;
          return;
        }

        let html = '';
        for (const docSnap of snapshot.docs) {
          const wishlistItem = docSnap.data();
          const productId = wishlistItem.productId;
          const productDoc = await getDoc(doc(db, 'products', productId));
          if (!productDoc.exists()) continue;
          const product = { id: productDoc.id, ...productDoc.data() };
          html += `
            <div class="glass-card product-card fade-up">
              <img src="${product.imageUrl || 'https://via.placeholder.com/300x160?text=No+Image'}" alt="${product.name}" loading="lazy" />
              <div class="p-4">
                <h3 class="font-bold text-lg text-gray-900">${product.name}</h3>
                <p class="text-sm text-gray-500 mt-1">${product.desc || ''}</p>
                <p class="text-2xl font-bold text-blue-600 mt-2">$${product.price}</p>
                <div class="mt-3 flex flex-wrap gap-2">
                  <button onclick="addToCart('${product.id}', '${product.name}', ${product.price}, '${product.imageUrl || ''}')" class="btn-primary text-sm py-2 px-4 flex-1 justify-center">
                    <i class="fas fa-cart-plus"></i> Add to Cart
                  </button>
                  <button onclick="removeFromWishlist('${docSnap.id}')" class="btn-outline text-sm py-2 px-4 text-red-500 border-red-200 hover:border-red-500 hover:text-red-600">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
        }
        grid.innerHTML = html;
      });
    });

    window.addToCart = (id, name, price, imageUrl) => {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existing = cart.find(item => item.id === id);
      if (existing) existing.quantity += 1;
      else cart.push({ id, name, price, imageUrl, quantity: 1 });
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      window.showToast('✅ Added to cart!', 'success');
    };

    window.removeFromWishlist = async (wishlistId) => {
      if (!confirm('Remove this product from wishlist?')) return;
      try {
        await deleteDoc(doc(db, 'wishlist', wishlistId));
        window.showToast('✅ Removed from wishlist', 'success');
      } catch (err) {
        window.showToast('⚠️ ' + err.message, 'error');
      }
    };
  </script>
</body>
</html>
